# steward-min-version: 0.21.0
#
# A Snowflake pipeline (ADR 0035, docs/COSTS.md#estimates). Quantities only: the inputs are your assumptions – the
# warehouse size, the hours a day and the days a month the warehouse runs, optionally the data ingested and the credits
# per gigabyte, serverless credits, data kept and data transferred out. The formulas count warehouse hours, credits,
# gigabyte-months and gigabytes; Steward prices them with the price book the estimate uses (a list book written by hand
# or from CSV, or the platform's contracted book). Books: examples/costs/price-books/snowflake-technical-factors.csv
# (credits per hour per warehouse size) and snowflake-contract-prices.csv (the same factors with invented money prices
# to replace with your contract's) – no real prices are shipped.
kind: costCalculator
id: snowflake-pipeline
name: Snowflake pipeline
description: >-
  A batch pipeline on a virtual warehouse: warehouse size × runtime × runs a day × days a month, optionally credits per
  gigabyte ingested, serverless credits, data kept and, optionally, data transferred out. The warehouse sizes are priced in
  credits per hour by the book; the credit's price is the book's (or your contract's).
checked: "2026-11-12"
inputs:
  - key: size
    label: Warehouse size
    type: select
    options: [XS, S, M, L, XL, 2XL, 3XL, 4XL]
    default: S
    help: A size doubles the credits per hour of the one before.
  - { key: minutes, label: Runtime per run, type: number, unit: min, default: 12, min: 0, max: 1440 }
  - {
      key: runs,
      label: Runs per day,
      type: integer,
      default: 24,
      min: 0,
      max: 1440,
      help: "Runtime per run × runs per day is the hours a day the warehouse runs.",
    }
  - {
      key: days,
      label: Days a month,
      type: number,
      unit: d,
      default: 30.4166666667,
      min: 0,
      max: 31,
      help: "The default is 730 hours a month, the convention of the cloud price lists.",
    }
  - {
      key: ingested,
      label: Data ingested per month,
      type: number,
      unit: GBy,
      default: 0,
      min: 0,
      help: "For ingest workloads, priced with the credits per gigabyte below.",
    }
  - {
      key: creditsPerGB,
      label: Credits per gigabyte ingested,
      type: number,
      unit: "{credit}/GBy",
      default: 0,
      min: 0,
      help: "Your measured rate, from the usage history of the ingest.",
    }
  - { key: serverless, label: Serverless credits per month, type: number, unit: "{credit}", default: 0, min: 0 }
  - { key: stored, label: Data kept, type: number, unit: GBy, default: 500, min: 0 }
  - { key: transfer, label: Data transferred out per month, type: number, unit: GBy, default: 0, min: 0 }
let:
  # warehouse hours per month: minutes per run × runs a day, on the days of the month
  hours: inputs.minutes / 60 * inputs.runs * inputs.days
lines:
  - key: compute
    label: Warehouse
    item: { provider: Snowflake, sku: "{{ 'warehouse-' & inputs.size }}" }
    quantity: let.hours
    unit: h
    group: Compute
  - key: ingest
    label: Ingest credits
    item: { provider: Snowflake, sku: compute-credit }
    quantity: inputs.creditsPerGB * inputs.ingested
    unit: "{credit}"
    group: Compute
    when: inputs.ingested > 0
  - key: serverless
    label: Serverless features
    item: { provider: Snowflake, sku: serverless-credit }
    quantity: inputs.serverless
    unit: "{credit}"
    group: Compute
  - key: storage
    label: Storage
    item: { provider: Snowflake, sku: storage }
    quantity: inputs.stored
    unit: GBy.mo
    group: Storage
  - key: transfer
    label: Data transfer out
    item: { provider: Snowflake, sku: data-transfer }
    quantity: inputs.transfer
    unit: GBy
    group: Transfer
    when: inputs.transfer > 0
