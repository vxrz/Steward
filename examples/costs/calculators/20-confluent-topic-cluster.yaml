# steward-min-version: 0.21.0
#
# A Confluent Cloud topic and its cluster (ADR 0035, docs/COSTS.md#estimates). Quantities only: cluster hours,
# gigabytes in and out from the throughput, gigabyte-months stored from throughput × retention × the copies the
# provider bills, partition hours and connector task hours. Steward prices them with the book the estimate uses –
# the items' SKUs are the ones of examples/costs/price-books/confluent-items.csv (no money prices are shipped).
kind: costCalculator
id: confluent-topic-cluster
name: Confluent topic and cluster
description: >-
  A topic on a Confluent Cloud cluster: elastic capacity (eCKU-hours) or a dedicated cluster (CKU-hours), ingress and
  egress from the throughput, storage from throughput × retention, partitions, and optionally a connector.
checked: "2026-11-12"
inputs:
  - { key: cluster, label: Cluster, type: select, options: [elastic, dedicated], default: elastic }
  - { key: eckus, label: Elastic capacity (eCKU), type: number, default: 1, min: 0, max: 100, help: The average eCKUs the cluster scales to. }
  - { key: ckus, label: Dedicated capacity (CKU), type: integer, default: 2, min: 1, max: 100, range: false }
  - { key: ingress, label: Throughput in, type: number, unit: MBy/s, default: 1, min: 0 }
  - { key: fanOut, label: Consumers reading everything, type: number, default: 2, min: 0, max: 100, help: Egress is the throughput in times this. }
  - { key: retention, label: Retention, type: number, unit: h, default: 168, min: 0 }
  - {
      key: copies,
      label: Copies billed,
      type: integer,
      default: 1,
      min: 1,
      max: 5,
      range: false,
      help: How many copies of the data the provider bills – see your contract.,
    }
  - { key: partitions, label: Partitions, type: integer, default: 6, min: 0, max: 10000 }
  - { key: tasks, label: Connector tasks, type: integer, default: 0, min: 0, max: 1000 }
  - { key: connectorThroughput, label: Connector throughput, type: number, unit: MBy/s, default: 0, min: 0 }
let:
  # megabytes per second over a month of 730 hours, in gigabytes
  ingressGB: inputs.ingress * const.hoursPerMonth * 3600 / 1000
  egressGB: let.ingressGB * inputs.fanOut
  storedGB: inputs.ingress * 3600 * inputs.retention / 1000 * inputs.copies
lines:
  - key: elastic
    label: Elastic cluster capacity
    item: { provider: Confluent, sku: ecku-hour }
    quantity: inputs.eckus * const.hoursPerMonth
    unit: "{eCKU}.h"
    group: Cluster
    when: inputs.cluster = 'elastic'
  - key: dedicated
    label: Dedicated cluster capacity
    item: { provider: Confluent, sku: cku-hour }
    quantity: inputs.ckus * const.hoursPerMonth
    unit: "{CKU}.h"
    group: Cluster
    when: inputs.cluster = 'dedicated'
  - { key: ingress, label: Ingress, item: { provider: Confluent, sku: network-ingress }, quantity: let.ingressGB, unit: GBy, group: Throughput }
  - { key: egress, label: Egress, item: { provider: Confluent, sku: network-egress }, quantity: let.egressGB, unit: GBy, group: Throughput }
  - { key: storage, label: Storage, item: { provider: Confluent, sku: storage }, quantity: let.storedGB, unit: GBy.mo, group: Storage }
  - key: partitions
    label: Partitions
    item: { provider: Confluent, sku: partition-hour }
    quantity: inputs.partitions * const.hoursPerMonth
    unit: "{partition}.h"
    group: Cluster
  - key: tasks
    label: Connector tasks
    item: { provider: Confluent, sku: connector-task-hour }
    quantity: inputs.tasks * const.hoursPerMonth
    unit: "{task}.h"
    group: Connectors
    when: inputs.tasks > 0
  - key: connectorThroughput
    label: Connector throughput
    item: { provider: Confluent, sku: connector-throughput }
    quantity: inputs.connectorThroughput * const.hoursPerMonth * 3600 / 1000
    unit: GBy
    group: Connectors
    when: inputs.connectorThroughput > 0
