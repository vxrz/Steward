# Machine data in InfluxDB (0.18.0): the newest point of every press, read from InfluxDB – one series per value of the
# tag "device", the worst press counts. Steward writes the query itself (Flux for 2.x, InfluxQL for 1.x, SQL for 3.x)
# and quotes every name and value. "platform: InfluxDB" finds your InfluxDB platform when it is the only one; on import
# you choose it otherwise. The bucket (2.x) is "database" on 1.x and 3.x. See docs/MONITORS.md#freshness-in-influxdb.
kind: monitor
key: influxdb-machine-data
name: Presses – machine data in InfluxDB
description: Every press writes machine_data every few seconds; a press that stops writing turns the check down.
tags: [influxdb, iot]
intervalSeconds: 60
checks:
  - id: presses
    name: Newest point of every press
    type: freshness
    source: influxdb
    platform: InfluxDB
    bucket: plant
    measurement: machine_data
    groupBy: device
    mode: cadence
    expectedIntervalSeconds: 60
    x: 0
    y: 0
  - id: hall-2-temperature
    name: Temperature in hall 2
    type: freshness
    source: influxdb
    platform: InfluxDB
    bucket: plant
    measurement: machine_data
    fields: [temperature]
    tags: { site: hall-2 }
    groupBy: device
    expectedSeries: [press-01, press-02, press-03]
    mode: maxAge
    maxAgeSeconds: 900
    critical: false
    x: 260
    y: 0
outputs:
  - id: notify
    type: notification
    subscribers: [role:operator]
