# Entra ID (v0.5.0): app secrets and certificates that expire, and the Microsoft 365 service health, read through a
# Microsoft Graph platform. "platform: Microsoft Graph" finds your Graph platform when it is the only one (or the only
# one whose name starts with "Microsoft Graph"); on import you choose it otherwise. Per app registration and type, the
# secret or certificate that lasts longest counts – an old one next to its replacement does not. See docs/ENTRA.md.
kind: monitor
key: entra-app-credentials
name: Entra ID app credentials
description: App registration secrets and certificates that end within 30 days (down within 7), and Microsoft 365 service health.
tags: [entra-id, credentials]
intervalSeconds: 3600
aggregate: { rule: worst }
checks:
  - id: app-credentials
    name: App secrets and certificates
    type: entra
    platform: Microsoft Graph
    mode: app-credentials
    withinDays: 30
    downWithinDays: 7
    x: 0
    y: 0
  - id: service-health
    name: Microsoft 365 service health
    type: entra
    platform: Microsoft Graph
    mode: service-health
    critical: false
    x: 260
    y: 0
