# Services Checkmk watches (#130): the state of a host and of services, as Checkmk sees them – unknown when Checkmk has
# not checked them for 15 minutes. "platform: Checkmk" finds your Checkmk platform when it is the only one (or the only
# one whose name starts with "Checkmk"); on import you choose it otherwise. Host and service names exactly as in
# Checkmk. See docs/CHECKMK.md.
kind: monitor
key: checkmk-database-host
name: Database host (Checkmk)
description: The database host db01 and its services, as Checkmk sees them.
tags: [checkmk]
intervalSeconds: 120
aggregate: { rule: worst }
checks:
  - id: host
    name: db01
    type: checkmk
    platform: Checkmk
    host: db01
    maxAgeSeconds: 900
    x: 0
    y: 0
  - id: var
    name: db01 – Filesystem /var
    type: checkmk
    platform: Checkmk
    host: db01
    service: Filesystem /var
    maxAgeSeconds: 900
    x: -160
    y: 160
  - id: cpu
    name: db01 – CPU load
    type: checkmk
    platform: Checkmk
    host: db01
    service: CPU load
    maxAgeSeconds: 900
    critical: false
    x: 160
    y: 160
links:
  - { from: host, to: var }
  - { from: host, to: cpu }
