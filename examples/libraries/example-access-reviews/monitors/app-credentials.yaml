kind: monitor
key: library-entra-app-credentials
name: Entra ID app credentials (library example)
description: App registration secrets and certificates that end within 30 days (down within 7). Installed disabled.
tags: [entra-id, credentials, library]
intervalSeconds: 3600
aggregate: { rule: worst }
checks:
  - id: app-credentials
    name: App secrets and certificates
    type: entra
    platform: idp
    mode: app-credentials
    withinDays: 30
    downWithinDays: 7
    x: 0
    y: 0
