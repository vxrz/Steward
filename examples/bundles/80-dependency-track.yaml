# steward-min-version: 0.4.0
name: Vulnerabilities (Dependency-Track)
description: |
  Open findings by severity and policy violations of the latest project versions every six hours, with the
  "Vulnerabilities" dashboard and, optionally, the monitor for new critical vulnerabilities
  (docs/DEPENDENCY-TRACK.md).
tags: [vulnerabilities, dependency-track]
platforms:
  - key: dtrack
    label: Dependency-Track
    kinds: [dependency-track]
processes:
  - template: 86-dependency-track-vulnerabilities
dashboards: [86-vulnerabilities]
monitors:
  - file: 40-new-critical-vulnerabilities.yaml
    optional: true
