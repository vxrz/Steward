# steward-min-version: 0.21.0
name: Snowflake (project, without ACCOUNT_USAGE)
description: |
  For teams that hold only project roles: the hourly task health (failed, skipped, slow, suspended and missed task
  runs) and the hourly check of dynamic tables (failed refreshes, lag above target, suspended) and streams (stale or
  going stale soon) of the project's databases, with the "Snowflake project pipelines" dashboard. Both read only the
  databases' own INFORMATION_SCHEMA and SHOW commands – USAGE on the database and schemas, MONITOR on the tasks and
  dynamic tables, SELECT on the streams and a warehouse are enough. Set the databases in the schedules' inputs.
  Read-only (docs/SNOWFLAKE.md).
tags: [operations, pipelines, snowflake]
platforms:
  - key: snowflake
    label: Snowflake account (a project role)
    kinds: [snowflake]
processes:
  - template: 623-snowflake-task-health
  - template: 624-snowflake-dynamic-tables-and-streams
dashboards: [64-snowflake-project-pipelines]
