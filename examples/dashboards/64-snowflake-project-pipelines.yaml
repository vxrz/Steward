# steward-min-version: 0.21.0
name: Snowflake project pipelines
description: Tasks, dynamic tables and streams of a project's Snowflake databases, read with the project's own grants (no ACCOUNT_USAGE) – fed by "Snowflake – Task health (project)" and "Snowflake – Dynamic tables and streams (project)" (both hourly).
refreshSeconds: 300
widgets:
  - id: intro
    type: markdown
    width: 12
    text: |
      **Snowflake project pipelines** – read by the processes *Snowflake – Task health (project)* and *Snowflake – Dynamic tables and streams (project)* from the project databases' own `INFORMATION_SCHEMA` table functions and `SHOW … IN DATABASE` – current, and only what the project role may see. Opening this page never calls Snowflake.
      Costs, users and logins need account-wide access (`SNOWFLAKE.ACCOUNT_USAGE`) and are on the dashboards *Snowflake account* and *Snowflake costs*.
  - { id: tasks, type: kpi, title: Tasks, dataset: snowflake.project-tasks, metric: tasks, width: 2 }
  - { id: failedTasks, type: kpi, title: Tasks failed, dataset: snowflake.project-tasks, metric: failed, goodWhen: down, width: 2 }
  - { id: suspendedTasks, type: kpi, title: Tasks suspended, dataset: snowflake.project-tasks, metric: suspended, goodWhen: down, width: 2 }
  - { id: notRun, type: kpi, title: Tasks that did not run, dataset: snowflake.project-tasks, metric: notRun, goodWhen: down, width: 2 }
  - { id: slowTasks, type: kpi, title: Tasks with slow runs, dataset: snowflake.project-tasks, metric: slow, goodWhen: down, width: 2 }
  - { id: taskStatus, type: status, title: Tasks by state, dataset: snowflake.project-tasks, width: 2 }
  - { id: taskTrend, type: trend, title: Task findings, dataset: snowflake.project-tasks, metrics: [failed, suspended, notRun], days: 30, width: 12 }
  - { id: taskTable, type: table, title: Tasks needing attention, dataset: snowflake.project-tasks, problemsOnly: true, width: 12 }
  - { id: dynamicTables, type: kpi, title: Dynamic tables, dataset: snowflake.project-pipelines, metric: dynamicTables, width: 2 }
  - { id: refreshFailures, type: kpi, title: Failing refreshes, dataset: snowflake.project-pipelines, metric: refreshFailures, goodWhen: down, width: 2 }
  - { id: lagging, type: kpi, title: Lagging, dataset: snowflake.project-pipelines, metric: lagging, goodWhen: down, width: 2 }
  - { id: suspendedDts, type: kpi, title: Dynamic tables suspended, dataset: snowflake.project-pipelines, metric: suspended, goodWhen: down, width: 2 }
  - { id: staleStreams, type: kpi, title: Streams stale, dataset: snowflake.project-pipelines, metric: staleStreams, goodWhen: down, width: 2 }
  - { id: soonStale, type: kpi, title: Streams stale soon, dataset: snowflake.project-pipelines, metric: soonStale, goodWhen: down, width: 2 }
  - { id: pipelineTable, type: table, title: Dynamic tables and streams needing attention, dataset: snowflake.project-pipelines, problemsOnly: true, width: 12 }
  - { id: taskChecks, type: checks, title: Latest task checks, process: snowflake-task-health, width: 6 }
  - { id: pipelineChecks, type: checks, title: Latest dynamic table and stream checks, process: snowflake-dynamic-tables-and-streams, width: 6 }
