name: Tenant usage
description: Insights Hub usage against the licence – users, assets, agents, asset attributes per asset type and a KPI of the Usage Transparency Service, with warning (80 %) and critical (95 %) levels. Fed by "Insights Hub – Tenant usage and licence check" (daily).
refreshSeconds: 300
widgets:
  - id: intro
    type: markdown
    width: 12
    text: |
      **Tenant usage** – read by the process *Insights Hub – Tenant usage and licence check*. Opening this page never calls the platform.
      Limits come from the inputs of the process (your contract); without a limit a figure is only counted. Rows turn **warning** from 80 % and **critical** from 95 %, and **unknown** when a figure could not be read – the failed step of the run shows the platform's answer.
  - { id: users, type: kpi, title: Licensed users used (%), dataset: ih.usage, metric: usersPercent, goodWhen: down, width: 3, days: 90 }
  - { id: assets, type: kpi, title: Licensed assets used (%), dataset: ih.usage, metric: assetsPercent, goodWhen: down, width: 3, days: 90 }
  - { id: attributes, type: kpi, title: Asset attributes used (%), dataset: ih.usage, metric: attributesPercent, goodWhen: down, width: 3, days: 90 }
  - { id: breaches, type: kpi, title: Figures at critical level, dataset: ih.usage, metric: critical, goodWhen: down, width: 3, days: 90 }
  - {
      id: trendUse,
      type: trend,
      title: Used of the licence over time (%),
      dataset: ih.usage,
      metrics: [attributesPercent, kpiPercent, maxPercent],
      days: 90,
      width: 8,
    }
  - { id: status, type: status, title: Figures by level, dataset: ih.usage, width: 4 }
  - id: usageChart
    type: vega
    title: Used share of each limit
    dataset: ih.usage
    width: 12
    spec:
      description: Used share of each licensed limit per figure, coloured by level; the dashed line marks 100 %.
      height: 180
      transform:
        - { calculate: "toNumber(datum['Used (%)'])", as: used }
        - { filter: "isValid(datum.used) && isFinite(datum.used)" }
      layer:
        - mark: { type: bar, cornerRadiusEnd: 2 }
          encoding:
            y: { field: Figure, type: nominal, sort: "-x", title: null }
            x: { field: used, type: quantitative, title: "Used (%)" }
            color:
              field: _status
              type: nominal
              scale: { domain: [good, warning, serious, critical, unknown], scheme: steward-status }
              legend: null
            tooltip:
              - { field: Figure }
              - { field: Used }
              - { field: Limit }
              - { field: used, type: quantitative, title: "Used (%)", format: ".0f" }
        - transform: [{ aggregate: [{ op: count, as: n }] }]
          mark: { type: rule, strokeDash: [4, 3] }
          encoding: { x: { datum: 100 } }
  - id: trendCounts
    type: trend
    title: "Users, assets and agents over time (%)"
    dataset: ih.usage
    metrics: [usersPercent, assetsPercent, agentsPercent]
    days: 90
    width: 6
  - { id: trendAttributes, type: trend, title: Asset attributes and KPI over time, dataset: ih.usage, metrics: [attributes, kpi], days: 90, width: 6 }
  - { id: problems, type: table, title: Figures above the warning level or not read, dataset: ih.usage, problemsOnly: true, width: 12 }
  - { id: all, type: table, title: All figures, dataset: ih.usage, width: 12 }
  - { id: perType, type: table, title: Asset attributes per asset type, dataset: ih.usage-attributes, width: 12 }
  - { id: checks, type: checks, title: Latest licence check, process: ih-tenant-usage, width: 6 }
  - { id: fresh, type: freshness, title: Data freshness, width: 6 }
