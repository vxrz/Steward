name: Vulnerabilities
description: Open findings and policy violations of the Dependency-Track projects – fed by "Dependency-Track – vulnerabilities per project" (every 6 hours, read-only API key).
refreshSeconds: 300
widgets:
  - id: intro
    type: markdown
    width: 12
    text: |
      **Vulnerabilities** – read by the process *Dependency-Track – vulnerabilities per project*. Opening this page never calls Dependency-Track.
      Findings analysed as not affected or false positive, and suppressed ones, do not count. Per application, the components that name their project show the same on the application page and in the scorecard part "Vulnerabilities".
  - { id: projects, type: kpi, title: Projects, dataset: dt.vulnerabilities, metric: projects, width: 3 }
  - { id: critical, type: kpi, title: Critical findings, dataset: dt.vulnerabilities, metric: critical, goodWhen: down, width: 3 }
  - { id: high, type: kpi, title: High findings, dataset: dt.vulnerabilities, metric: high, goodWhen: down, width: 3 }
  - { id: policy, type: kpi, title: Failing policy violations, dataset: dt.vulnerabilities, metric: policyFail, goodWhen: down, width: 3 }
  - { id: status, type: status, title: By state, dataset: dt.vulnerabilities, width: 4 }
  - id: trend
    type: trend
    title: "Critical, high and failing policies"
    dataset: dt.vulnerabilities
    metrics: [critical, high, policyFail]
    days: 30
    width: 8
  - { id: problems, type: table, title: Needing attention, dataset: dt.vulnerabilities, problemsOnly: true, width: 12 }
  - { id: all, type: table, title: All projects, dataset: dt.vulnerabilities, width: 12 }
  - { id: checks, type: checks, title: Latest read-out, process: dependency-track-vulnerabilities, width: 6 }
  - { id: fresh, type: freshness, title: Data freshness, width: 6 }
