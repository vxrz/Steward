name: Access governance
description: Who has access to Insights Hub, Snowflake and the Git hosts, and is it still justified? Users, privileged roles, group hygiene and the latest access reviews – fed by the inventory snapshot, privileged access review, group hygiene, Snowflake project access review and Git member review processes.
refreshSeconds: 120
widgets:
  - { id: total, type: kpi, title: Users, dataset: ih.users, metric: total, width: 3 }
  - { id: active, type: kpi, title: Active (30 days), dataset: ih.users, metric: active30, goodWhen: up, width: 3 }
  - { id: inactive, type: kpi, title: Inactive (90+ days), dataset: ih.users, metric: inactive90, goodWhen: down, width: 3 }
  - { id: never, type: kpi, title: Never signed in, dataset: ih.users, metric: neverLoggedIn, goodWhen: down, width: 3 }
  - { id: admins, type: kpi, title: Privileged assignments, dataset: ih.privileged, metric: privileged, goodWhen: down, width: 3 }
  - { id: staleAdmins, type: kpi, title: Privileged without recent login, dataset: ih.privileged, metric: stale90, goodWhen: down, width: 3 }
  - { id: emptyGroups, type: kpi, title: Empty groups, dataset: ih.groups, metric: empty, goodWhen: down, width: 3 }
  - { id: onlyDefault, type: kpi, title: Users with default role only, dataset: ih.groups, metric: onlyDefaultRole, goodWhen: down, width: 3 }
  - { id: activity, type: status, title: User activity, dataset: ih.users, width: 6 }
  - { id: trend, type: trend, title: Active vs. inactive users, dataset: ih.users, metrics: [active30, inactive90], days: 90, width: 6 }
  - { id: inactiveUsers, type: table, title: Users to review, dataset: ih.users, problemsOnly: true, width: 12 }
  - { id: privileged, type: table, title: Privileged access, dataset: ih.privileged, width: 6 }
  - { id: groups, type: table, title: Group hygiene, dataset: ih.groups, problemsOnly: true, width: 6 }
  - { id: gitMembers, type: kpi, title: Git memberships, dataset: git.members, metric: members, width: 3 }
  - { id: gitNo2fa, type: kpi, title: Git members without 2FA, dataset: git.members, metric: no2fa, goodWhen: down, width: 3 }
  - { id: gitOutside, type: kpi, title: Outside collaborators, dataset: git.members, metric: outside, goodWhen: down, width: 3 }
  - { id: sfInactive, type: kpi, title: Snowflake project users inactive, dataset: snowflake.project-access, metric: inactive, goodWhen: down, width: 3 }
  - { id: git, type: table, title: Git members (latest review), dataset: git.members, problemsOnly: true, width: 6 }
  - { id: snowflake, type: table, title: Snowflake project access (latest review), dataset: snowflake.project-access, problemsOnly: true, width: 6 }
  - id: howto
    type: markdown
    width: 12
    text: |
      **Cadence:** inventory hourly · access review 1 + 2 quarterly · privileged review monthly · group hygiene weekly · Snowflake project and Git member reviews quarterly.
      Destructive steps (removing roles, offboarding) always require a second person (four-eyes).
  - { id: fresh, type: freshness, width: 12 }
