name: Repositories
description: Pipelines of the default branches, releases and open security alerts of the repositories you follow – fed by "GitHub – repository health" (every hour, read-only token).
refreshSeconds: 300
widgets:
  - id: intro
    type: markdown
    width: 12
    text: |
      **Repositories** – read by the process *GitHub – repository health*. Opening this page never calls GitHub.
      The tech stack, end of life, deploy keys and tokens of repositories are on the applications (components of type "Repository"); monitors check pipelines with the check type "Repository pipeline".
  - { id: repositories, type: kpi, title: Repositories, dataset: git.repositories, metric: repositories, width: 3 }
  - { id: failing, type: kpi, title: Default branches failing, dataset: git.repositories, metric: failing, goodWhen: down, width: 3 }
  - { id: critical, type: kpi, title: Critical alerts, dataset: git.repositories, metric: critical, goodWhen: down, width: 3 }
  - { id: high, type: kpi, title: High alerts, dataset: git.repositories, metric: high, goodWhen: down, width: 3 }
  - { id: status, type: status, title: By state, dataset: git.repositories, width: 4 }
  - { id: trend, type: trend, title: Failing and alerts, dataset: git.repositories, metrics: [failing, critical, high], days: 30, width: 8 }
  - { id: problems, type: table, title: Needing attention, dataset: git.repositories, problemsOnly: true, width: 12 }
  - { id: all, type: table, title: All repositories, dataset: git.repositories, width: 12 }
  - { id: checks, type: checks, title: Latest read-out, process: github-repository-health, width: 6 }
  - { id: fresh, type: freshness, title: Data freshness, width: 6 }
