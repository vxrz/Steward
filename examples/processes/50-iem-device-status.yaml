name: "Industrial Edge – Device status check"
description: |
  Shows which edge devices are online. The IEM device list says only whether a
  device is onboarded (`deviceStatus`: ACTIVE, PENDING or DELETED), not whether
  it is connected. The online state therefore comes from the device statistics:
  the newest key of `GET /portal/api/v1/devices/{id}/statistics` is the time of
  the device's last report (epoch milliseconds). Devices report about once per
  report interval (`SystemInfo.Period` of the report, usually 60 minutes; 60
  when it is missing). A device whose last report is at most the interval plus
  `onlineWithinMinutes` old is online, an older report means offline. A
  device without statistics is "unknown", a PENDING device "not onboarded" –
  neither counts as offline. Deleted devices are left out.

  Calls: the device list in pages of 100 (one call per 100 devices) plus one
  statistics call per ACTIVE device, 4 at a time – about 303 calls for 300
  devices.

  Recommended schedule: every 30–60 minutes. Publishes `iem.device-status`
  (lightweight online/offline view). For firmware compliance and offline
  durations use "Industrial Edge – Inventory snapshot", which feeds `iem.devices`.
tags: [status, health, industrial-edge]
connections:
  - slot: iem
    kind: industrial-edge-management
inputs:
  - name: onlineWithinMinutes
    label: Grace after the device's report interval before it counts as offline (minutes)
    type: number
    default: 15
steps:
  - id: devices
    type: http
    name: List devices
    connection: iem
    method: GET
    path: /portal/api/v1/devices
    paginate: { mode: page, firstPage: 1, pageSize: 100, itemsPath: data, totalPagesPath: totalPages }
    saveAs: devices
  - id: fleet
    type: set
    name: Devices in IEM
    values:
      all: "{{ [vars.devices.body[deviceStatus != 'DELETED'].{ 'id': deviceId, 'name': deviceName, 'onboarding': deviceStatus }] }}"
      active: "{{ [vars.all[onboarding = 'ACTIVE']] }}"
  - id: read
    type: forEach
    name: Last report of each onboarded device (4 in parallel)
    items: vars.active
    as: device
    concurrency: 4
    maxItems: 2000
    saveAs: read
    steps:
      - id: stats
        type: http
        name: Device statistics
        connection: iem
        method: GET
        path: "/portal/api/v1/devices/{{ $encodeUrlComponent(vars.device.id) }}/statistics"
        expectStatus: [200, 400, 404]
        onError: continue
        saveAs: stats
      - id: row
        type: set
        name: State of the device
        values:
          row: >-
            {{ (
              $times := vars.stats.status = 200 ? $keys(vars.stats.body.data)[$contains($, /^[0-9]+$/)];
              $last := $max($times.$number($));
              $minutes := $exists($last) ? ($toMillis($now()) - $last) / 60000;
              $report := $exists($last) ? $string($lookup(vars.stats.body.data, $string($last)));
              $p := $match($report, /Period\W+([0-9.]+) *(minute|hour)/)[0];
              $interval := $p ? $number($p.groups[0]) * ($p.groups[1] = 'hour' ? 60 : 1) : 60;
              $online := $exists($last) and $minutes <= $interval + $inputs.onlineWithinMinutes;
              {
                'id': vars.device.id,
                'name': vars.device.name,
                'onboarding': vars.device.onboarding,
                'lastSeen': $last,
                'interval': $interval,
                'state': $not($exists($last)) ? 'unknown' : ($online ? 'online' : 'offline'),
                'offlineHours': $exists($last) and $not($online) ? $round($minutes / 60, 1)
              }
            ) }}
          stats: "{{ null }}"
  - id: evaluate
    type: set
    name: Evaluate device states
    values:
      rows: "{{ [vars.read.results.row, vars.all[onboarding = 'PENDING'].$merge([$, { 'state': 'not onboarded' }])]^(name) }}"
      offline: "{{ [vars.rows[state = 'offline']] }}"
  - id: allOnline
    type: check
    name: All onboarded devices online
    severity: warning
    condition: "$count(vars.offline) = 0"
    message: "{{ $count(vars.offline) }} of {{ $count(vars.active) }} onboarded device(s) offline: {{ $join(vars.offline.(name & ' (' & offlineHours & ' h)'), ', ') }}"
  - id: report
    type: report
    name: Device overview
    title: Device status
    rows: vars.rows
    columns:
      - { label: Device, value: name }
      - { label: State, value: state }
      - { label: Onboarding, value: onboarding }
      - { label: Last seen, value: "$exists(lastSeen) ? $fromMillis(lastSeen, '[Y0001]-[M01]-[D01] [H01]:[m01]') : '–'" }
  - id: publish
    type: publish
    name: Publish device status
    dataset: iem.device-status
    title: Edge device connection status
    rows: vars.rows
    key: id
    columns:
      - { label: Device, value: name }
      - { label: State, value: state }
      - { label: Onboarding, value: onboarding }
      - { label: Last seen, value: "$exists(lastSeen) ? $fromMillis(lastSeen, '[Y0001]-[M01]-[D01] [H01]:[m01]') : '–'" }
      - { label: Report interval (min), value: "$exists(interval) ? interval : '–'" }
      - { label: Offline (h), value: "$exists(offlineHours) ? offlineHours : '–'" }
    status: "state = 'online' ? 'good' : (state = 'offline' ? 'critical' : 'unknown')"
    statusText: >-
      state = 'offline' ? 'offline for ' & offlineHours & ' h'
        : (state = 'unknown' ? 'no statistics reported'
        : (state = 'not onboarded' ? 'not onboarded yet (' & onboarding & ')' : 'online'))
    metrics:
      graceMinutes: "$inputs.onlineWithinMinutes"
      total: "$count(vars.rows)"
      online: "$count(vars.rows[state = 'online'])"
      offline: "$count(vars.offline)"
      unknown: "$count(vars.rows[state = 'unknown'])"
      pending: "$count(vars.rows[state = 'not onboarded'])"
    staleAfterMinutes: 120
