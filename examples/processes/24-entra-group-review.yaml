# steward-min-version: 0.5.0
name: "Entra ID – Group owner and membership review"
description: |
  The owners and members of chosen Entra ID groups, reviewed by their owners:
  every member – direct or through a nested group – with the type (member or
  guest), whether the account is enabled and the last sign-in, and the owners
  of each group. The reviewer ticks the direct memberships that stay (enabled
  accounts that signed in within N days are preselected); members through a
  nested group are listed for information and reviewed in that group. A second
  person confirms the removals (four-eyes), a manual step lists what to remove
  in the Entra admin center – Steward reads Entra ID only –, a second person
  verifies, and the removals are documented as access changes
  (`group:<name>`, the right the access reconciliation uses).

  Checks: groups without an owner, guests and disabled accounts in the groups.
  Recommended schedule: quarterly (`30 7 1 2,5,8,11 *`). Publishes
  `entra.group-members` (one row per membership). Needs Group.Read.All and
  User.Read.All; the last sign-in AuditLog.Read.All and Entra ID P1
  (docs/ENTRA.md).
recommendedSchedule: "30 7 1 2,5,8,11 *"
tags: [access-review, governance, entra-id, groups]
connections:
  - slot: graph
    kind: microsoft-graph
    description: Entra ID tenant (Microsoft Graph, read-only)
inputs:
  - name: groups
    label: Groups to review (display names)
    type: list
    default: [Developers, Partner Portal Users]
    required: true
  - name: activeWithinDays
    label: Preselect members who signed in within (days)
    type: number
    default: 90
steps:
  - id: valid
    type: check
    name: Group names are given
    condition: '$count(inputs.groups[$trim($) != '''']) > 0 and $count(inputs.groups[$contains($, "''")]) = 0'
    message: "Name at least one group; names must not contain an apostrophe (')"
    failRun: true
  - id: perGroup
    type: forEach
    name: Each group (2 in parallel)
    items: "inputs.groups[$trim($) != '']"
    as: name
    concurrency: 2
    maxItems: 50
    saveAs: perGroup
    steps:
      - id: findGroup
        type: http
        name: The group
        connection: graph
        method: GET
        path: /v1.0/groups
        query: { $filter: '{{ "displayName eq ''" & $trim(vars.name) & "''" }}', $select: "id,displayName" }
        saveAs: found
      - id: readMembers
        type: http
        name: Direct members
        when: "$count(vars.found.body.value) > 0"
        connection: graph
        method: GET
        path: "/v1.0/groups/{{ vars.found.body.value[0].id }}/members"
        query: { $select: "id,displayName,userPrincipalName,mail,userType,accountEnabled", $top: 999 }
        paginate: { mode: nextLink, nextPath: "`@odata.nextLink`", itemsPath: value, maxPages: 100 }
        saveAs: direct
      - id: readTransitive
        type: http
        name: Members through nested groups
        when: "$count(vars.found.body.value) > 0"
        connection: graph
        method: GET
        path: "/v1.0/groups/{{ vars.found.body.value[0].id }}/transitiveMembers"
        query: { $select: "id,displayName,userPrincipalName,mail,userType,accountEnabled", $top: 999 }
        paginate: { mode: nextLink, nextPath: "`@odata.nextLink`", itemsPath: value, maxPages: 100 }
        saveAs: transitive
      - id: readOwners
        type: http
        name: Owners
        when: "$count(vars.found.body.value) > 0"
        connection: graph
        method: GET
        path: "/v1.0/groups/{{ vars.found.body.value[0].id }}/owners"
        query: { $select: "id,displayName,userPrincipalName" }
        paginate: { mode: nextLink, nextPath: "`@odata.nextLink`", itemsPath: value, maxPages: 10 }
        saveAs: owners
      - id: collect
        type: set
        name: The group's memberships
        values:
          group: >-
            {{ (
              $g := vars.found.body.value[0];
              $directIds := [vars.direct.body.id];
              $g ? {
                "name": $g.displayName,
                "id": $g.id,
                "owners": [vars.owners.body.(userPrincipalName ? userPrincipalName : displayName)],
                "members": [vars.transitive.body[`@odata.type` = '#microsoft.graph.user'].(
                  {
                    "id": id,
                    "upn": userPrincipalName,
                    "name": displayName,
                    "mail": mail ? mail : '',
                    "type": userType = 'Guest' ? 'guest' : 'member',
                    "enabled": accountEnabled != false,
                    "via": id in $directIds ? 'direct' : 'nested group'
                  }
                )]
              } : { "name": vars.name, "missing": true, "owners": [], "members": [] }
            ) }}
  - id: readSignIns
    type: http
    name: Last sign-in of the users (Entra ID P1)
    connection: graph
    method: GET
    path: /v1.0/users
    query: { $select: "id,signInActivity", $top: 999 }
    paginate: { mode: nextLink, nextPath: "`@odata.nextLink`", itemsPath: value, maxPages: 200 }
    onError: continue
    saveAs: signIns
  - id: rows
    type: set
    name: One row per membership
    values:
      groups: "{{ [vars.perGroup.results.group] }}"
      missing: "{{ [vars.groups[missing = true].name] }}"
      ownerless: "{{ [vars.groups[$not(missing = true) and $count(owners) = 0].name] }}"
      signInsReadable: "{{ $not($exists(vars.signIns.error)) }}"
      rows: >-
        {{ (
          $users := $exists(vars.signIns.error) ? {} : $merge(vars.signIns.body.{ id: $ });
          $signIns := $not($exists(vars.signIns.error));
          [vars.groups[$not(missing = true)].(
            $g := $;
            members.(
              $u := $lookup($users, id);
              $times := [$ts($u.signInActivity.lastSignInDateTime), $ts($u.signInActivity.lastNonInteractiveSignInDateTime)];
              $last := $count($times) ? $max($times) : undefined;
              {
                "key": $g.id & '|' & id,
                "group": $g.name,
                "owners": $count($g.owners) ? $join($g.owners, ', ') : '–',
                "upn": upn,
                "name": name,
                "mail": mail,
                "type": type,
                "enabled": enabled,
                "via": via,
                "right": 'group:' & $g.name & (via = 'direct' ? '' : ' (nested)'),
                "lastSignIn": $signIns ? ($last ? $fromMillis($last, '[Y0001]-[M01]-[D01]') : 'never') : 'not available',
                "days": $last ? $daysSince($last) : null
              }
            )
          )]
        ) }}
      direct: "{{ [vars.rows[via = 'direct']] }}"
      guests: "{{ [vars.rows[type = 'guest']] }}"
      disabled: "{{ [vars.rows[enabled = false]] }}"
  - id: attest
    type: userTask
    name: Which direct memberships stay?
    when: "$count(vars.direct) > 0"
    mode: select
    title: "Group review: tick the {{ $count(vars.direct) }} direct membership(s) of {{ $join(vars.groups[$not(missing = true)].name, ', ') }} that stay"
    instructions: |
      **Unticked** memberships are removed after a second person confirms. Enabled accounts that signed in within
      the last {{ inputs.activeWithinDays }} days are preselected.
      Members through a nested group are not listed here – review the nested group.
      {{ $count(vars.ownerless) ? 'Groups without an owner: ' & $join(vars.ownerless, ', ') & ' – name an owner.' : '' }}
      {{ $count(vars.missing) ? 'Not found: ' & $join(vars.missing, ', ') : '' }}
    items: vars.direct
    itemKey: key
    columns:
      - { label: Group, value: group }
      - { label: Member, value: "name & (mail ? ' <' & mail & '>' : '')" }
      - { label: Type, value: type }
      - { label: Enabled, value: "enabled ? 'yes' : 'no'" }
      - { label: Last sign-in, value: lastSignIn }
      - { label: Owners, value: owners }
    preselect: "enabled and days != null and days <= $inputs.activeWithinDays"
    saveAs: attestation
  - id: confirm
    type: userTask
    name: Confirm the removals (four-eyes)
    when: "$count(vars.attestation.unselected) > 0"
    mode: approve
    title: "Remove {{ $count(vars.attestation.unselected) }} group membership(s)?"
    instructions: |
      Reviewed by {{ vars.attestation.decidedBy }}. A different person has to confirm.

      {{ $join(vars.attestation.unselected.('- ' & name & ' from ' & group), '\n') }}
    assignees: [role:approver, role:admin]
    fourEyes: true
    onReject: continue
    saveAs: removal
  - id: removeInEntra
    type: userTask
    mode: manual
    name: Remove the memberships in the Entra admin center
    when: "vars.removal.approved = true"
    title: "Remove {{ $count(vars.attestation.unselected) }} membership(s) in Entra ID"
    instructions: |
      Steward reads Entra ID only. In the Entra admin center (Groups → the group → Members) remove:

      {{ $join(vars.attestation.unselected.('- ' & group & ': ' & name & ' <' & upn & '>'), '\n') }}

      A second person verifies the result before the removals are documented.
    checklist:
      - Members removed in the Entra admin center
      - "Checked: the groups no longer list them"
    checklistAllRequired: true
    fields:
      - id: ticket
        type: ticket
        label: Change ticket
        hint: e.g. CHG0012345
    evidence: optional
    verification:
      required: true
      onReject: return
    saveAs: removed
  - id: documentRemoved
    type: accessChange
    name: Document the removed memberships
    when: "vars.removal.approved = true and vars.removed.completed = true"
    connection: graph
    kind: revoke
    items: vars.attestation.unselected
    subjectId: upn
    subjectName: name
    rights: "[right]"
    reason: "Group review: membership not attested"
    requestRef: "{{ vars.removed.fields.ticket ? vars.removed.fields.ticket : '' }}"
    approvedBy: "{{ vars.removal.decidedBy }}"
  - id: publish
    type: publish
    name: Publish the memberships
    dataset: entra.group-members
    title: Entra ID group memberships
    rows: vars.rows
    key: key
    columns:
      - { label: Group, value: group }
      - { label: Member, value: name }
      - { label: Type, value: type }
      - { label: Via, value: via }
      - { label: Last sign-in, value: lastSignIn }
      - { label: Owners, value: owners }
      - label: Review
        value: >-
          via != 'direct' ? 'in the nested group'
            : (key in $vars.attestation.selectedKeys ? 'kept'
            : ($vars.removal.approved = true ? ($vars.removed.completed = true ? 'removed' : 'to remove')
            : ($exists($vars.attestation) ? 'removal rejected' : 'not reviewed')))
    status: "enabled = false ? 'critical' : (type = 'guest' or owners = '–' or lastSignIn = 'never' ? 'warning' : 'good')"
    statusText: "enabled = false ? 'disabled account' : (owners = '–' ? 'group without owner' : (type = 'guest' ? 'guest' : (lastSignIn = 'never' ? 'never signed in' : '')))"
    metrics:
      groups: "$count(vars.groups[$not(missing = true)])"
      memberships: "$count(vars.rows)"
      guests: "$count(vars.guests)"
      disabled: "$count(vars.disabled)"
      ownerless: "$count(vars.ownerless)"
      removed: "vars.removal.approved = true and vars.removed.completed = true ? $count(vars.attestation.unselected) : 0"
    staleAfterMinutes: 264960
  - id: ownersCheck
    type: check
    name: Every group has an owner
    severity: warning
    condition: "$count(vars.ownerless) = 0 and $count(vars.missing) = 0"
    message: "{{ $count(vars.ownerless) = 0 and $count(vars.missing) = 0 ? 'Every group reviewed has an owner' : $join($append(vars.ownerless.($ & ': no owner'), vars.missing.($ & ': not found')), '; ') }}"
    headline: "{{ $count(vars.ownerless) }} group(s) without an owner"
    value: "$count(vars.ownerless)"
    items: "$append(vars.ownerless.($ & ': no owner'), vars.missing.($ & ': not found'))"
  - id: disabledCheck
    type: check
    name: No disabled account in the groups
    severity: warning
    condition: "$count(vars.disabled) = 0"
    message: "{{ $count(vars.disabled) = 0 ? 'No disabled account is a member' : $join(vars.disabled.(group & ': ' & name), '; ') }}"
    headline: "{{ $count(vars.disabled) }} disabled account(s) in the groups"
    value: "$count(vars.disabled)"
    items: "vars.disabled.(group & ': ' & name)"
  - id: guestsCheck
    type: check
    name: Guests in the groups
    severity: info
    condition: "$count(vars.guests) = 0"
    message: "{{ $count(vars.guests) = 0 ? 'No guest is a member' : $join(vars.guests.(group & ': ' & name & ' (' & via & ')'), '; ') }}"
    headline: "{{ $count(vars.guests) }} guest membership(s)"
    value: "$count(vars.guests)"
    items: "vars.guests.(group & ': ' & name & ' (' & via & ')')"
  - id: summary
    type: report
    name: Summary
    title: Group owner and membership review
    text: |
      - Groups: **{{ $join(vars.groups[$not(missing = true)].name, ', ') }}**{{ $count(vars.missing) ? ' (not found: ' & $join(vars.missing, ', ') & ')' : '' }}
      - Memberships: **{{ $count(vars.rows) }}** ({{ $count(vars.direct) }} direct), guests: **{{ $count(vars.guests) }}**, disabled: **{{ $count(vars.disabled) }}**
      - Kept: **{{ $count(vars.attestation.selected) }}**, removed: **{{ vars.removal.approved = true and vars.removed.completed = true ? $count(vars.attestation.unselected) : 0 }}**{{ run.dryRun ? ' – dry run' : '' }}
      {{ $count(vars.ownerless) ? '- Without an owner: ' & $join(vars.ownerless, ', ') : '' }}
    rows: vars.rows
    columns:
      - { label: Group, value: group }
      - { label: Member, value: name }
      - { label: Via, value: via }
      - label: Result
        value: "via != 'direct' ? '–' : (key in $vars.attestation.selectedKeys ? 'kept' : ($vars.removal.approved = true ? 'removed' : 'kept (not confirmed)'))"
