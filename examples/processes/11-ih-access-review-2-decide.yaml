name: "Insights Hub – Access review 2: decide and clean up"
description: |
  Phase 2 of the user housekeeping procedure. Lists everyone in the review
  group and asks you who still needs access (users who logged in again
  recently are preselected). Kept users are removed from the review group;
  for all others access is revoked after a final approval – either by
  removing all their group/role memberships or by deleting the user. The
  revocation needs a second person (four-eyes). Removing memberships never
  touches INDIRECT memberships (inherited through another group) nor the
  groups of the input "Never remove" – the internal OIDC scope groups
  (openid, profile, email, …) every user is implicitly a member of, listed
  as DIRECT but not removable; each removal is reported per user and group
  with the API's answer, and a refused one does not stop the others
  (docs/INSIGHTS-HUB-USERS.md).

  Recommended schedule: quarterly, two to four weeks after "Access review 1"
  (`0 7 25 1,4,7,10 *`).
tags: [access-review, governance, users, insights-hub]
connections:
  - slot: hub
    kind: insights-hub
inputs:
  - name: reviewGroup
    label: Review group (display name)
    type: string
    default: mdsp_usergroup:AccessReview
    required: true
  - name: activeWithinDays
    label: Preselect users who logged in within (days)
    type: number
    default: 14
  - name: revokeMode
    label: How to revoke access
    type: select
    options: [removeFromAllGroups, deleteUser]
    default: removeFromAllGroups
  - name: neverTouch
    label: Never remove these groups (internal OIDC scope groups)
    type: list
    default:
      [openid, profile, email, phone, address, roles, user_attributes, uaa.user, uaa.offline_token, approvals.me, password.write, scim.me, oauth.approvals]
steps:
  - id: setup
    type: set
    name: Resolve API paths
    values:
      idm: "{{ $pvar('hub', 'idmPath', '/api/identitymanagement/v3') }}"
      keep: "{{ [inputs.neverTouch.$lowercase($trim($))] }}"
      results: "{{ [] }}"
  - id: findGroup
    type: http
    name: Find review group
    connection: hub
    method: GET
    path: "{{ vars.idm }}/Groups"
    query:
      filter: 'displayName eq "{{ inputs.reviewGroup }}"'
    saveAs: groupResult
  - id: groupExists
    type: check
    name: Review group exists
    condition: "$count(vars.groupResult.body.resources) = 1"
    failRun: true
  - id: members
    type: http
    name: List review group members
    connection: hub
    method: GET
    path: "{{ vars.idm }}/Groups/{{ vars.groupResult.body.resources[0].id }}/members"
    saveAs: members
  - id: listUsers
    type: http
    name: List all users
    connection: hub
    method: GET
    path: "{{ vars.idm }}/Users"
    paginate: { mode: scim, pageSize: 100 }
    saveAs: users
  - id: flagged
    type: set
    name: Resolve flagged users
    values:
      group: "{{ vars.groupResult.body.resources[0] }}"
      memberIds: "{{ [vars.members.body.value] }}"
      flagged: "{{ vars.users.body[id in $vars.memberIds][] }}"
  - id: decide
    type: userTask
    name: Who still needs access?
    when: "$count(vars.flagged) > 0"
    mode: select
    title: "Access review: tick the {{ $count(vars.flagged) }} user(s) who still need access"
    instructions: |
      **Ticked** users keep their access and are removed from `{{ inputs.reviewGroup }}`.
      **Unticked** users lose access ({{ inputs.revokeMode = 'deleteUser' ? 'user is deleted' : 'all group and role memberships are removed' }}) – you will be asked to confirm once more.
      Users who logged in within the last {{ inputs.activeWithinDays }} days are preselected.
    items: vars.flagged
    itemKey: id
    columns:
      - { label: User, value: userName }
      - { label: Last login, value: "$ts(lastLogonTime) ? $fromMillis($ts(lastLogonTime), '[Y0001]-[M01]-[D01]') : 'never'" }
      - { label: Days, value: "$ts(lastLogonTime) ? $daysSince(lastLogonTime) : '–'" }
      - { label: Groups, value: "$join(groups[display != $inputs.reviewGroup].display, ', ')" }
    preselect: "$ts(lastLogonTime) and $daysSince(lastLogonTime) <= $inputs.activeWithinDays"
    saveAs: decision
  - id: keep
    type: forEach
    name: Clear review flag for kept users
    when: "$count(vars.decision.selected) > 0"
    items: vars.decision.selected
    as: user
    steps:
      - id: unflag
        type: http
        name: Remove from review group
        connection: hub
        method: DELETE
        path: "{{ vars.idm }}/Groups/{{ vars.group.id }}/members/{{ vars.user.id }}"
        expectStatus: [200, 204, 404]
  - id: approveRevoke
    type: userTask
    name: Confirm revocation (four-eyes)
    when: "$count(vars.decision.unselected) > 0"
    mode: approve
    title: "Revoke access for {{ $count(vars.decision.unselected) }} user(s)?"
    instructions: |
      Mode: **{{ inputs.revokeMode }}**. Decided by {{ vars.decision.decidedBy }}; a different person has to confirm.

      {{ $join(vars.decision.unselected.('- ' & userName), '\n') }}
    assignees: [role:approver, role:admin]
    fourEyes: true
    onReject: continue
    saveAs: revokeApproval
  - id: revoke
    type: forEach
    name: Revoke access
    when: "vars.revokeApproval.approved = true"
    items: vars.decision.unselected
    as: user
    steps:
      - id: mode
        type: if
        name: Revoke mode
        condition: "$inputs.revokeMode = 'deleteUser'"
        then:
          - id: deleteUser
            type: http
            name: Delete user
            connection: hub
            method: DELETE
            path: "{{ vars.idm }}/Users/{{ vars.user.id }}"
            expectStatus: [200, 204, 404]
        else:
          - id: memberships
            type: forEach
            name: Remove all removable memberships
            items: "vars.user.groups[$not(type = 'INDIRECT') and $not($lowercase(display) in $vars.keep)]"
            as: grp
            steps:
              - id: removeMembership
                type: http
                name: Remove membership
                connection: hub
                method: DELETE
                path: "{{ vars.idm }}/Groups/{{ vars.grp.value }}/members/{{ vars.user.id }}"
                # every answer is kept and reported per group; a refusal does not stop the other removals
                expectStatus: [200, 204, 400, 403, 404, 409, 500, 503]
                saveAs: removed
              - id: removeResult
                type: set
                name: Result of the removal
                values:
                  results: >-
                    {{ $append(vars.results, [{
                      'userName': vars.user.userName,
                      'group': vars.grp.display,
                      'status': vars.removed.dryRun ? 'dry run' : $string(vars.removed.status),
                      'result': vars.removed.dryRun ? 'dry run – not removed'
                        : (vars.removed.status in [200, 204] ? 'removed' : (vars.removed.status = 404 ? 'not a member (any more)' : 'failed')),
                      'message': vars.removed.dryRun or vars.removed.status in [200, 204] ? ''
                        : $substring($string(vars.removed.body.errors[0].message ? vars.removed.body.errors[0].message
                          : (vars.removed.body.error_description ? vars.removed.body.error_description : (vars.removed.body.message ? vars.removed.body.message : vars.removed.body))), 0, 300)
                    }]) }}
  - id: outcome
    type: set
    name: What was revoked
    when: "vars.revokeApproval.approved = true"
    values:
      failures: "{{ [vars.results[result = 'failed']] }}"
      # deleteUser: every unselected user; removeFromAllGroups: the users who lost at least one membership
      revoked: >-
        {{ $inputs.revokeMode = 'deleteUser' ? [vars.decision.unselected]
          : [vars.decision.unselected[($n := userName; $count($vars.results[userName = $n and result = 'removed']) > 0)]] }}
  - id: failuresCheck
    type: check
    name: Every membership removal went through
    severity: warning
    when: "vars.revokeApproval.approved = true and $inputs.revokeMode = 'removeFromAllGroups'"
    condition: "$count(vars.failures) = 0"
    message: >-
      {{ $count(vars.failures) = 0 ? 'Nothing failed'
        : $join(vars.failures.(userName & ' / ' & group & ': HTTP ' & status & ' – ' & message), '; ') }}
    headline: "{{ $count(vars.failures) & ' Insights Hub membership removal(s) failed' }}"
    value: "$count(vars.failures)"
    items: "vars.failures.(userName & ' / ' & group & ': HTTP ' & status & ' – ' & message)"
  - id: documentRevoked
    type: accessChange
    name: Document revoked access
    when: "vars.revokeApproval.approved = true and $count(vars.revoked) > 0"
    connection: hub
    kind: offboarding
    items: vars.revoked
    subjectId: id
    subjectName: userName
    # deleteUser: the memberships went with the account; removeFromAllGroups: those actually removed
    rights: >-
      $inputs.revokeMode = 'deleteUser' ? [groups[$not(type = 'INDIRECT')].display]
        : ($n := userName; [$vars.results[userName = $n and result = 'removed'].group])
    rightsBefore: "[groups.display]"
    reason: "Access review: access no longer needed ({{ inputs.revokeMode }})"
    approvedBy: "{{ vars.revokeApproval.decidedBy }}"
  - id: summary
    type: report
    name: Summary
    title: Access review result
    text: |
      - Users under review: **{{ $count(vars.flagged) }}**
      - Kept (review flag cleared): **{{ $count(vars.decision.selected) }}**
      - Access revoked ({{ inputs.revokeMode }}): **{{ vars.revokeApproval.approved = true ? $count(vars.decision.unselected) : 0 }}**{{ vars.revokeApproval.approved = false ? ' – revocation was rejected, users stay in the review group' : '' }}
    rows: >-
      $append(
        [vars.decision.selected.{ 'user': userName, 'group': '–', 'result': 'kept', 'status': '', 'message': '' }],
        $inputs.revokeMode = 'removeFromAllGroups' and vars.revokeApproval.approved = true
          ? $append(
              [vars.results.{ 'user': userName, 'group': group, 'result': result, 'status': status, 'message': message }],
              [vars.decision.unselected.(
                $n := userName;
                groups[type = 'INDIRECT' or $lowercase(display) in $vars.keep].{
                  'user': $n, 'group': display, 'result': type = 'INDIRECT' ? 'kept (inherited)' : 'kept (internal scope group)', 'status': '', 'message': ''
                }
              )]
            )
          : [vars.decision.unselected.{ 'user': userName, 'group': '–', 'result': $vars.revokeApproval.approved = true ? 'deleted' : 'still under review', 'status': '', 'message': '' }]
      )
    columns:
      - { label: User, value: user }
      - { label: Group, value: group }
      - { label: Result, value: result }
      - { label: HTTP, value: status }
      - { label: Message, value: message }
