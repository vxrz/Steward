# steward-min-version: 0.2.7
name: "Git – repository health (GitHub, GitLab, Forgejo)"
description: |
  Reads the repositories you list from GitHub (also Enterprise Server),
  GitLab or Forgejo / Gitea – the connection decides which (read-only token,
  see docs/GIT-PLATFORMS.md): the default branch and whether it is protected,
  the newest pipeline on it (GitHub workflow runs, GitLab pipelines, Forgejo
  commit status), the latest release, the open Dependabot alerts by severity
  (GitHub) and the deploy and project access tokens that expire soon (GitLab).
  Checks warn while a pipeline of a default branch fails, a default branch is
  not protected, a repository has critical or high alerts or a token expires.
  Read-only.

  Recommended schedule: every hour (`0 * * * *`), one schedule per host, with
  "message on change" in the schedule's notification policy. Publishes
  `git.repositories` (one part per host, one row per repository; metrics
  repositories, failing, critical, high, unprotected, tokensExpiring) for the
  "Repositories" dashboard. The tech stack of repositories (Dockerfile,
  package.json …, end of life), their deploy keys and tokens are read by
  Steward itself for application components of type "Repository"; monitors use
  the check type "Repository pipeline"; access reviews use the source "Git".
  The connection slot is still called "github", so existing schedules keep
  their binding.
recommendedSchedule: "0 * * * *"
tags: [git, github, gitlab, forgejo, security]
connections:
  - slot: github
    kinds: [github, gitlab, forgejo]
    description: GitHub (https://api.github.com or https://HOST/api/v3), GitLab (https://HOST/api/v4) or Forgejo / Gitea (https://HOST/api/v1), read-only token
inputs:
  - name: repositories
    label: Repositories (owner/repo; GitLab group/project)
    type: list
    default: [acme/shop-web, acme/shop-api]
  - name: tokenDays
    label: Warn about tokens expiring within (days, GitLab)
    type: number
    default: 30
steps:
  - id: setup
    type: set
    name: Host
    values:
      host: "{{ conn.github.kind in ['gitlab', 'forgejo'] ? conn.github.kind : 'github' }}"
  - id: read
    type: forEach
    name: Read each repository (3 in parallel)
    items: "inputs.repositories"
    as: repo
    concurrency: 3
    maxItems: 100
    saveAs: read
    steps:
      - id: ofHost
        type: if
        name: GitLab?
        condition: "vars.host = 'gitlab'"
        then:
          - id: glInfo
            type: http
            name: Project
            connection: github
            method: GET
            path: "/projects/{{ $encodeUrlComponent($trim(vars.repo)) }}"
            saveAs: info
          - id: glPipelines
            type: http
            name: Pipelines of the default branch
            connection: github
            method: GET
            path: "/projects/{{ $encodeUrlComponent($trim(vars.repo)) }}/pipelines"
            query: { ref: "{{ vars.info.body.default_branch }}", per_page: "20" }
            onError: continue
            saveAs: pipelines
          - id: glProtected
            type: http
            name: Is the default branch protected?
            connection: github
            method: GET
            path: "/projects/{{ $encodeUrlComponent($trim(vars.repo)) }}/protected_branches/{{ $encodeUrlComponent(vars.info.body.default_branch) }}"
            expectStatus: [200, 404]
            onError: continue
            saveAs: protection
          - id: glRelease
            type: http
            name: Latest release
            connection: github
            method: GET
            path: "/projects/{{ $encodeUrlComponent($trim(vars.repo)) }}/releases"
            query: { per_page: "1" }
            onError: continue
            saveAs: release
          - id: glDeployTokens
            type: http
            name: Deploy tokens
            connection: github
            method: GET
            path: "/projects/{{ $encodeUrlComponent($trim(vars.repo)) }}/deploy_tokens"
            onError: continue
            saveAs: deployTokens
          - id: glAccessTokens
            type: http
            name: Project access tokens
            connection: github
            method: GET
            path: "/projects/{{ $encodeUrlComponent($trim(vars.repo)) }}/access_tokens"
            onError: continue
            saveAs: accessTokens
          - id: glRow
            type: set
            name: Row of the project
            values:
              row: >-
                {{ (
                  $latest := $exists(vars.pipelines.error) ? undefined : vars.pipelines.body[$not(status in ['canceled', 'skipped', 'manual', 'created', 'scheduled'])][0];
                  $failed := $latest.status = 'failed';
                  $tokens := $append(
                    [vars.deployTokens.body[$not(revoked) and $not(expired) and $exists(expires_at) and expires_at != null].{ 'name': 'deploy token ' & name, 'left': -$daysSince(expires_at) }],
                    [vars.accessTokens.body[active and $not(revoked) and $exists(expires_at) and expires_at != null].{ 'name': 'access token ' & name, 'left': -$daysSince(expires_at) }]
                  );
                  $soon := [$tokens[left <= $inputs.tokenDays]];
                  $protected := $exists(vars.protection.error) ? null : vars.protection.status = 200;
                  {
                    "key": vars.repo,
                    "host": 'GitLab',
                    "repository": vars.repo,
                    "branch": vars.info.body.default_branch,
                    "protected": $protected = null ? 'not readable' : ($protected ? 'yes' : 'no'),
                    "pipeline": $exists(vars.pipelines.error) ? 'not readable' : ($not($exists($latest)) ? 'no runs' : ($failed ? 'failed: pipeline ' & $latest.id : ($latest.status = 'success' ? 'passed' : $latest.status))),
                    "release": $exists(vars.release.error) or $count(vars.release.body) = 0 ? '–' : vars.release.body[0].tag_name,
                    "alerts": '–',
                    "tokens": $count($soon) = 0 ? '–' : $join($soon.(name & ' (' & (left < 0 ? 'expired' : 'in ' & left & ' days') & ')'), ', '),
                    "failed": $failed ? 1 : 0,
                    "critical": 0,
                    "high": 0,
                    "unprotected": $protected = false ? 1 : 0,
                    "tokensExpiring": $count($soon),
                    "status": $failed ? 'critical' : ($protected = false or $count($soon) > 0 ? 'warning' : 'good')
                  }
                ) }}
        else:
          - id: ofForgejo
            type: if
            name: Forgejo / Gitea?
            condition: "vars.host = 'forgejo'"
            then:
              - id: fjInfo
                type: http
                name: Repository
                connection: github
                method: GET
                path: "/repos/{{ $join([$split($trim(vars.repo), '/').$encodeUrlComponent($)], '/') }}"
                saveAs: info
              - id: fjStatus
                type: http
                name: Commit status of the default branch
                connection: github
                method: GET
                path: "/repos/{{ $join([$split($trim(vars.repo), '/').$encodeUrlComponent($)], '/') }}/commits/{{ $encodeUrlComponent(vars.info.body.default_branch) }}/status"
                onError: continue
                saveAs: commitStatus
              - id: fjProtections
                type: http
                name: Branch protections
                connection: github
                method: GET
                path: "/repos/{{ $join([$split($trim(vars.repo), '/').$encodeUrlComponent($)], '/') }}/branch_protections"
                onError: continue
                saveAs: protections
              - id: fjRelease
                type: http
                name: Latest release
                connection: github
                method: GET
                path: "/repos/{{ $join([$split($trim(vars.repo), '/').$encodeUrlComponent($)], '/') }}/releases/latest"
                onError: continue
                saveAs: release
              - id: fjRow
                type: set
                name: Row of the repository
                values:
                  row: >-
                    {{ (
                      $branch := vars.info.body.default_branch;
                      $state := $exists(vars.commitStatus.error) ? undefined : vars.commitStatus.body.state;
                      $failed := $state in ['failure', 'error'];
                      $rules := [vars.protections.body.(rule_name ? rule_name : branch_name)];
                      $protected := $exists(vars.protections.error) ? null : ($branch in $rules or '*' in $rules);
                      {
                        "key": vars.repo,
                        "host": 'Forgejo',
                        "repository": vars.repo,
                        "branch": $branch,
                        "protected": $protected = null ? 'not readable' : ($protected ? 'yes' : 'no'),
                        "pipeline": $exists(vars.commitStatus.error) ? 'not readable' : ($not($exists($state)) or $state = '' ? 'no runs' : ($failed ? 'failed: ' & $join(vars.commitStatus.body.statuses[status in ['failure', 'error']].context, ', ') : ($state = 'success' ? 'passed' : $state))),
                        "release": $exists(vars.release.error) ? '–' : vars.release.body.tag_name,
                        "alerts": '–',
                        "tokens": '–',
                        "failed": $failed ? 1 : 0,
                        "critical": 0,
                        "high": 0,
                        "unprotected": $protected = false ? 1 : 0,
                        "tokensExpiring": 0,
                        "status": $failed ? 'critical' : ($protected = false ? 'warning' : 'good')
                      }
                    ) }}
            else:
              - id: info
                type: http
                name: Repository
                connection: github
                method: GET
                path: "/repos/{{ $join([$split(vars.repo, '/').$encodeUrlComponent($)], '/') }}"
                saveAs: info
              - id: branch
                type: http
                name: Is the default branch protected?
                connection: github
                method: GET
                path: "/repos/{{ $join([$split(vars.repo, '/').$encodeUrlComponent($)], '/') }}/branches/{{ $encodeUrlComponent(vars.info.body.default_branch) }}"
                onError: continue
                saveAs: branch
              - id: runs
                type: http
                name: Workflow runs of the default branch
                connection: github
                method: GET
                path: "/repos/{{ $join([$split(vars.repo, '/').$encodeUrlComponent($)], '/') }}/actions/runs"
                query:
                  branch: "{{ vars.info.body.default_branch }}"
                  per_page: "50"
                  exclude_pull_requests: "true"
                onError: continue
                saveAs: runs
              - id: release
                type: http
                name: Latest release
                connection: github
                method: GET
                path: "/repos/{{ $join([$split(vars.repo, '/').$encodeUrlComponent($)], '/') }}/releases/latest"
                onError: continue
                saveAs: release
              - id: alerts
                type: http
                name: Open Dependabot alerts
                connection: github
                method: GET
                path: "/repos/{{ $join([$split(vars.repo, '/').$encodeUrlComponent($)], '/') }}/dependabot/alerts"
                query: { state: open, per_page: "100" }
                onError: continue
                saveAs: alerts
              - id: summarize
                type: set
                name: Row of the repository
                values:
                  row: >-
                    {{ (
                      $runs := $exists(vars.runs.error) ? [] : [vars.runs.body.workflow_runs[event != 'pull_request' and conclusion != 'cancelled' and conclusion != 'skipped']];
                      $ids := $distinct($runs.workflow_id);
                      $latest := [$ids.($id := $; $runs[workflow_id = $id][0])];
                      $failed := [$latest[status = 'completed' and conclusion != 'success' and conclusion != 'neutral'].name];
                      $sev := $exists(vars.alerts.error) ? [] : [vars.alerts.body.security_advisory.severity];
                      $critical := $count($sev[$ = 'critical']);
                      $high := $count($sev[$ = 'high']);
                      $protected := $exists(vars.branch.error) ? null : vars.branch.body.protected = true;
                      {
                        "key": vars.repo,
                        "host": 'GitHub',
                        "repository": vars.repo,
                        "branch": vars.info.body.default_branch,
                        "protected": $protected = null ? 'not readable' : ($protected ? 'yes' : 'no'),
                        "pipeline": $count($latest) = 0 ? 'no runs' : ($count($failed) > 0 ? 'failed: ' & $join($failed, ', ') : 'passed'),
                        "release": $exists(vars.release.error) ? '–' : vars.release.body.tag_name,
                        "alerts": $exists(vars.alerts.error) ? 'not readable' : $critical & ' critical, ' & $high & ' high, ' & ($count($sev) - $critical - $high) & ' other',
                        "tokens": '–',
                        "failed": $count($failed),
                        "critical": $critical,
                        "high": $high,
                        "unprotected": $protected = false ? 1 : 0,
                        "tokensExpiring": 0,
                        "status": $count($failed) > 0 or $critical > 0 ? 'critical' : ($high > 0 or $protected = false ? 'warning' : 'good')
                      }
                    ) }}
  - id: evaluate
    type: set
    name: Problems
    values:
      rows: "{{ [vars.read.results.row] }}"
      failing: "{{ [vars.rows[failed > 0]] }}"
      exposed: "{{ [vars.rows[critical + high > 0]] }}"
      unprotected: "{{ [vars.rows[unprotected > 0]] }}"
      expiring: "{{ [vars.rows[tokensExpiring > 0]] }}"
  - id: publish
    type: publish
    name: Publish for the dashboard
    dataset: git.repositories
    title: Repositories
    rows: vars.rows
    key: key
    columns:
      - { label: Repository, value: repository }
      - { label: Host, value: host }
      - { label: Branch, value: branch }
      - { label: Protected, value: protected }
      - { label: Pipeline, value: pipeline }
      - { label: Latest release, value: release }
      - { label: Open alerts, value: alerts }
      - { label: Tokens expiring, value: tokens }
    status: status
    statusText: "failed > 0 ? pipeline : (critical + high > 0 ? alerts : (unprotected > 0 ? 'default branch not protected' : (tokensExpiring > 0 ? tokens : '')))"
    metrics:
      repositories: "$count(vars.rows)"
      failing: "$count(vars.failing)"
      critical: "$sum(vars.rows.critical)"
      high: "$sum(vars.rows.high)"
      unprotected: "$count(vars.unprotected)"
      tokensExpiring: "$sum(vars.rows.tokensExpiring)"
    staleAfterMinutes: 180
  - id: pipelinesPass
    type: check
    name: Default branches build
    severity: warning
    condition: "$count(vars.failing) = 0"
    message: "{{ $count(vars.failing) = 0 ? 'The pipelines of all ' & $count(vars.rows) & ' default branches passed' : $join(vars.failing.(repository & ' – ' & pipeline), '; ') }}"
    headline: "{{ $count(vars.failing) }} default branches fail"
    value: "$count(vars.failing)"
    items: "vars.failing.(repository & ': ' & pipeline)"
  - id: noSevereAlerts
    type: check
    name: No critical or high security alerts
    severity: warning
    condition: "$count(vars.exposed) = 0"
    message: "{{ $count(vars.exposed) = 0 ? 'No critical or high Dependabot alerts' : $join(vars.exposed.(repository & ' – ' & alerts), '; ') }}"
    headline: "{{ $count(vars.exposed) }} repositories with critical or high alerts"
    value: "$count(vars.exposed)"
    items: "vars.exposed.(repository & ': ' & alerts)"
  - id: branchesProtected
    type: check
    name: Default branches are protected
    severity: warning
    condition: "$count(vars.unprotected) = 0"
    message: "{{ $count(vars.unprotected) = 0 ? 'Every readable default branch is protected' : $join(vars.unprotected.(repository & ' (' & branch & ')'), ', ') & ' not protected' }}"
    headline: "{{ $count(vars.unprotected) }} default branches not protected"
    value: "$count(vars.unprotected)"
    items: "vars.unprotected.(repository & ': ' & branch)"
  - id: tokensValid
    type: check
    name: No token expires soon
    severity: warning
    condition: "$count(vars.expiring) = 0"
    message: "{{ $count(vars.expiring) = 0 ? 'No deploy or access token expires within ' & inputs.tokenDays & ' days' : $join(vars.expiring.(repository & ': ' & tokens), '; ') }}"
    headline: "{{ $sum(vars.rows.tokensExpiring) }} tokens expire within {{ inputs.tokenDays }} days"
    value: "$sum(vars.rows.tokensExpiring)"
    items: "vars.expiring.(repository & ': ' & tokens)"
