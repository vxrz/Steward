# steward-min-version: 0.5.0
name: "Entra ID – Expiring app secrets and certificates"
description: |
  The client secrets and certificates of the app registrations of an Entra ID
  tenant – and the SAML signing certificates of its enterprise applications –
  with their end date: expired ones, those that end within N days, and those
  replaced by a newer one already (rotated, the old one can be deleted). Per
  application and type, a credential counts as rotated when another one of the
  same type lasts longer than the window. Read-only: Graph returns names, ids
  and dates, never a secret's value.

  To be reminded by the credentials register, import them there once
  (Credentials → Import from Entra ID): the entries keep their expiry in step
  with Entra ID on every later import. A monitor check of type "Entra ID"
  watches the same dates in between.

  Recommended schedule: daily (`50 6 * * *`), with "message on change" in the
  schedule's notification policy. Publishes `entra.app-credentials` (one row
  per secret or certificate) for the "Entra ID governance" dashboard.
  Needs Application.Read.All (docs/ENTRA.md).
recommendedSchedule: "50 6 * * *"
tags: [entra-id, credentials, security]
connections:
  - slot: graph
    kind: microsoft-graph
    description: Entra ID tenant (Microsoft Graph, read-only)
inputs:
  - name: withinDays
    label: Report credentials that end within (days)
    type: number
    default: 30
  - name: criticalDays
    label: Critical when ending within (days)
    type: number
    default: 7
steps:
  - id: readApps
    type: http
    name: App registrations with their secrets and certificates
    connection: graph
    method: GET
    path: /v1.0/applications
    query: { $select: "id,appId,displayName,passwordCredentials,keyCredentials", $top: 999 }
    paginate: { mode: nextLink, nextPath: "`@odata.nextLink`", itemsPath: value, maxPages: 100 }
    saveAs: apps
  - id: readEnterprise
    type: http
    name: Enterprise applications (signing certificates)
    connection: graph
    method: GET
    path: /v1.0/servicePrincipals
    query:
      $filter: "tags/any(t:t eq 'WindowsAzureActiveDirectoryIntegratedApp')"
      $select: id,appId,displayName,passwordCredentials,keyCredentials
      $top: 999
    paginate: { mode: nextLink, nextPath: "`@odata.nextLink`", itemsPath: value, maxPages: 100 }
    onError: continue
    saveAs: enterprise
  - id: rows
    type: set
    name: One row per secret or certificate
    values:
      all: >-
        {{ (
          $now := $millis();
          $one := function($a, $owner) {(
            $append(
              [$a.passwordCredentials.{ "a": $a, "c": $, "type": 'secret' }],
              [$a.keyCredentials[usage != 'Sign'].{ "a": $a, "c": $, "type": 'certificate' }]
            ).(
              $end := $ts(c.endDateTime);
              {
                "key": c.keyId,
                "owner": $owner,
                "app": a.displayName ? a.displayName : a.appId,
                "appId": a.appId,
                "type": type,
                "name": c.displayName ? c.displayName : '–',
                "keyId": '…' & $substring(c.keyId, -8),
                "ends": $end ? $fromMillis($end, '[Y0001]-[M01]-[D01]') : 'never',
                "daysLeft": $end ? $floor(($end - $now) / 86400000) : null
              }
            )
          )};
          [$append(
            [vars.apps.body.$one($, 'app registration')],
            $exists(vars.enterprise.error) ? [] : [vars.enterprise.body.$one($, 'enterprise application')]
          )]
        ) }}
      rows: >-
        {{ (
          $all := vars.all;
          [$all.(
            $r := $;
            $longest := $max($all[appId = $r.appId and type = $r.type and owner = $r.owner and daysLeft != null].daysLeft);
            $rotated := $r.daysLeft != null and $longest > $r.daysLeft and $longest > $inputs.withinDays;
            $merge([$r, {
              "rotated": $rotated,
              "finding": $r.daysLeft = null ? ''
                : ($rotated and $r.daysLeft < 0 ? 'expired, replaced – delete it'
                : ($rotated ? ''
                : ($r.daysLeft < 0 ? 'expired ' & (0 - $r.daysLeft) & ' day(s) ago'
                : ($r.daysLeft <= $inputs.withinDays ? 'ends in ' & $r.daysLeft & ' day(s)' : ''))))
            }])
          )]
        ) }}
      expired: "{{ [vars.rows[daysLeft != null and daysLeft < 0 and rotated = false]] }}"
      expiring: "{{ [vars.rows[daysLeft != null and daysLeft >= 0 and daysLeft <= $inputs.withinDays and rotated = false]] }}"
      leftover: "{{ [vars.rows[rotated = true and daysLeft < 0]] }}"
  - id: publish
    type: publish
    name: Publish the app credentials
    dataset: entra.app-credentials
    title: Entra ID app secrets and certificates
    rows: vars.rows
    key: key
    columns:
      - { label: Application, value: app }
      - { label: Kind, value: owner }
      - { label: Type, value: type }
      - { label: Name, value: name }
      - { label: Key id, value: keyId }
      - { label: Ends, value: ends }
      - { label: Days left, value: "daysLeft != null ? daysLeft : '–'" }
      - { label: Finding, value: "finding ? finding : '–'" }
    status: >-
      rotated = false and daysLeft != null and daysLeft <= $inputs.criticalDays ? 'critical'
        : (finding != '' ? 'warning' : 'good')
    statusText: finding
    metrics:
      credentials: "$count(vars.rows)"
      expired: "$count(vars.expired)"
      expiring: "$count(vars.expiring)"
      leftover: "$count(vars.leftover)"
      applications: "$count($distinct(vars.rows.appId))"
    staleAfterMinutes: 2880
  - id: expiredCheck
    type: check
    name: No app credential has expired
    severity: error
    condition: "$count(vars.expired) = 0"
    message: "{{ $count(vars.expired) = 0 ? 'No secret or certificate has expired without a newer one' : $join(vars.expired.(app & ' ' & type & ' ' & name & ': ' & finding), '; ') }}"
    headline: "{{ $count(vars.expired) }} app credential(s) expired"
    value: "$count(vars.expired)"
    items: "vars.expired.(app & ' – ' & type & ' ' & name & ' (ended ' & ends & ')')"
  - id: expiringCheck
    type: check
    name: No app credential ends soon
    severity: warning
    condition: "$count(vars.expiring) = 0"
    message: "{{ $count(vars.expiring) = 0 ? 'No secret or certificate ends within ' & inputs.withinDays & ' days' : $join(vars.expiring.(app & ' ' & type & ' ' & name & ': ' & finding), '; ') }}"
    headline: "{{ $count(vars.expiring) }} app credential(s) end within {{ inputs.withinDays }} days"
    value: "$count(vars.expiring)"
    items: "vars.expiring.(app & ' – ' & type & ' ' & name & ' (ends ' & ends & ')')"
  - id: leftoverCheck
    type: check
    name: Replaced credentials are deleted
    severity: info
    condition: "$count(vars.leftover) = 0"
    message: "{{ $count(vars.leftover) = 0 ? 'No expired secret or certificate is left next to its replacement' : $join(vars.leftover.(app & ' ' & type & ' ' & name), '; ') }}"
    headline: "{{ $count(vars.leftover) }} replaced credential(s) left over"
    value: "$count(vars.leftover)"
  - id: summary
    type: report
    name: Summary
    title: Expiring app secrets and certificates
    text: |
      - Secrets and certificates: **{{ $count(vars.rows) }}** of {{ $count($distinct(vars.rows.appId)) }} application(s){{ $exists(vars.enterprise.error) ? ' – enterprise applications: not available (permission)' : '' }}
      - Expired: **{{ $count(vars.expired) }}**, ending within {{ inputs.withinDays }} days: **{{ $count(vars.expiring) }}**, replaced but left over: **{{ $count(vars.leftover) }}**
      - Into the credentials register: Credentials → Import from Entra ID
    rows: "vars.rows[finding != '']"
    columns:
      - { label: Application, value: app }
      - { label: Type, value: type }
      - { label: Name, value: name }
      - { label: Ends, value: ends }
      - { label: Finding, value: finding }
