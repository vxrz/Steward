# The master passphrase as a file (SM_MASTER_PASSPHRASE_FILE). Better than this file: create the Secret from a file
# that never lands in Git –
#   kubectl create secret generic steward-passphrase --from-file=passphrase=./passphrase.txt
# Not part of kustomization.yaml on purpose.
apiVersion: v1
kind: Secret
metadata:
  name: steward-passphrase
  labels:
    app.kubernetes.io/name: steward
type: Opaque
stringData:
  passphrase: REPLACE-WITH-YOUR-MASTER-PASSPHRASE
