# Woodpecker CI: database platforms (#203) against real servers – MariaDB 11.4 (LTS) and SQL Server 2022 as
# service containers (counterpart of the "test-databases" job in .github/workflows/ci.yml, the same images pinned by
# digest). PostgreSQL runs in postgres.yaml. The test creates its own database and accounts.
# The passwords are throw-away values for these services only (no secret needed). SQL Server needs an amd64 agent
# with about 2 GB of memory for the service.

variables:
  - &node_image node:24-trixie-slim@sha256:43b9ba1142b8dcf33fa8f922ca1be85714adc444e0586c7cf7726daaeabc1bea
  - &mariadb_image mariadb:11.4.12@sha256:4f1d8d202fcf7bcb3902f63af09f9c1a050c2922a89652f22abaec0d4f015e83
  - &mssql_image mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
  # as in ci.yaml
  - &code_paths
    exclude: ['docs/**/*.png', 'docs/**/*.svg', '.github/**']

when:
  - event: push
    branch: [main, 'claude/**']
    path: *code_paths
  - event: pull_request
    path: *code_paths
  - event: manual

labels:
  platform: linux/amd64

services:
  - name: mariadb
    image: *mariadb_image
    environment:
      MARIADB_ROOT_PASSWORD: steward-ci-root
    ports:
      - 3306
  - name: mssql
    image: *mssql_image
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Steward-ci-sa-1
    ports:
      - 1433

steps:
  - name: install
    image: *node_image
    environment:
      npm_config_fund: 'false'
      npm_config_update_notifier: 'false'
    commands:
      # as in GitHub CI (the test needs no install script)
      - npm ci --ignore-scripts --no-audit

  # Woodpecker services have no health check: wait with each server's own client, as GitHub's --health-cmd does
  - name: wait-for-mariadb
    image: *mariadb_image
    commands:
      - for i in $$(seq 1 60); do mariadb-admin ping -h mariadb -uroot -psteward-ci-root --silent && exit 0; sleep 2; done; exit 1

  - name: wait-for-mssql
    image: *mssql_image
    commands:
      - for i in $$(seq 1 60); do /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P Steward-ci-sa-1 -Q 'SELECT 1' && exit 0; sleep 3; done; exit 1

  - name: test-databases
    image: *node_image
    depends_on: [install, wait-for-mariadb, wait-for-mssql]
    environment:
      SM_TEST_MYSQL_URL: mysql://root:steward-ci-root@mariadb:3306/
      SM_TEST_MSSQL_URL: mssql://sa:Steward-ci-sa-1@mssql:1433/
    commands:
      - cd server && npx vitest run test/dbms-integration.test.ts
