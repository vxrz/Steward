# Woodpecker CI: browser (UI) tests with Playwright against a demo server
# (counterpart of .github/workflows/ui-tests.yml, see docs/TESTING.md).
#
# Image: node:24 + "playwright install --with-deps chromium" (as on GitHub). The official
# mcr.microsoft.com/playwright:v1.56.1-noble image ships Node 22, but Steward needs Node 24.
#
# Woodpecker has no artifact store: on failure the "report" step prints the server log and
# the list of failed tests with their traces. To keep the HTML report and traces, enable the
# commented "upload-report" step (S3/MinIO) – see docs/WOODPECKER.md "Test reports".

variables:
  - &node_image node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
  - &code_paths
    exclude: ['**/*.md', 'LICENSE', 'NOTICE', '.github/**', 'docs/*.svg']

when:
  - event: push
    branch: [main, 'claude/**']
    path: *code_paths
  - event: pull_request
    path: *code_paths
  - event: manual

steps:
  - name: ui-tests
    image: *node_image
    environment:
      npm_config_fund: 'false'
      npm_config_update_notifier: 'false'
    commands:
      - npm ci --no-audit
      - npx playwright install --with-deps chromium
      - npm run build # the tests use the built UI in web/dist
      - npm run test:ui

  - name: report
    image: *node_image
    commands:
      - echo "--- failed tests (traces/screenshots in test-results/)"
      - find test-results -maxdepth 2 \( -name 'trace.zip' -o -name '*.png' \) 2>/dev/null | sort || true
      - echo "--- demo server log (e2e/.auth/server.log, last 200 lines)"
      - tail -n 200 e2e/.auth/server.log 2>/dev/null || echo "(no server log)"
    when:
      - event: [push, pull_request, manual]
        status: [failure]

  # Optional: keep playwright-report/ and test-results/ in an S3-compatible bucket (MinIO, …).
  # Create the secrets s3_access_key / s3_secret_key (image filter: woodpeckerci/plugin-s3),
  # pin the plugin by digest and uncomment.
  # - name: upload-report
  #   image: woodpeckerci/plugin-s3:<version>@sha256:<digest>
  #   settings:
  #     endpoint: https://minio.example.com
  #     bucket: ci-reports
  #     path_style: true
  #     source: '{playwright-report,test-results}/**/*'
  #     target: /steward/${CI_PIPELINE_NUMBER}
  #     access_key:
  #       from_secret: s3_access_key
  #     secret_key:
  #       from_secret: s3_secret_key
  #   when:
  #     - event: [push, manual]
  #       status: [failure]
