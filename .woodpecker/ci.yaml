# Woodpecker CI: build and test (counterpart of .github/workflows/ci.yml).
# Typecheck, lint and formatting, example validation, i18n and OpenAPI checks, the vitest suite (incl. browser
# automation, so Chromium is installed), the web UI build and npm audit of the production
# dependencies. Steps run in parallel after "install" and share the workspace.
# Setup and secrets: docs/WOODPECKER.md. This workflow needs no secrets.

variables:
  # node:24-trixie-slim – the same digest as the Dockerfile (Dependabot updates the Dockerfile;
  # keep both in sync, see docs/WOODPECKER.md "Updating pinned images")
  - &node_image node:24-trixie-slim@sha256:43b9ba1142b8dcf33fa8f922ca1be85714adc444e0586c7cf7726daaeabc1bea
  # documentation-only changes don't need a test run (docs/openapi.json is not excluded: it is checked)
  - &code_paths
    exclude: ['**/*.md', 'LICENSE', 'NOTICE', '.github/**', 'docs/*.svg']
  - &npm_env
    npm_config_fund: 'false'
    npm_config_update_notifier: 'false'

when:
  - event: push
    branch: [main, 'claude/**']
    path: *code_paths
  - event: pull_request
    path: *code_paths
  # tags: release.yaml depends on this workflow; manual: "Run pipeline" in the UI
  - event: [tag, manual]

steps:
  - name: install
    image: *node_image
    environment: *npm_env
    commands:
      - node --version && npm --version
      - npm ci --no-audit

  - name: typecheck
    image: *node_image
    depends_on: [install]
    commands:
      - npm run typecheck

  - name: lint
    image: *node_image
    depends_on: [install]
    commands:
      - npm run lint # ESLint
      - npm run format:check # Prettier

  - name: validate
    image: *node_image
    depends_on: [install]
    commands:
      - npm run validate # example processes and dashboards

  - name: i18n
    image: *node_image
    depends_on: [install]
    commands:
      - npm run i18n:check

  - name: openapi
    image: *node_image
    depends_on: [install]
    commands:
      - npm run openapi -- --check # docs/openapi.json is up to date

  - name: test
    image: *node_image
    depends_on: [install]
    environment: *npm_env
    commands:
      # browser automation tests need Chromium and its system libraries (apt, as root);
      # the libraries only exist in this step's container, so install and test in one step
      - npx playwright install --with-deps chromium
      - npm test

  - name: build
    image: *node_image
    depends_on: [install]
    commands:
      - npm run build # web UI → web/dist
      - node scripts/build-exe.mjs --bundle-only # the desktop executable's server bundles as CommonJS

  - name: audit
    image: *node_image
    depends_on: [] # needs only package-lock.json
    environment: *npm_env
    commands:
      - npm audit --omit=dev --audit-level=moderate # production dependencies
