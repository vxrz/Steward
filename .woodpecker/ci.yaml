# Woodpecker CI: build and test (counterpart of .github/workflows/ci.yml).
# Typecheck, lint and formatting, example validation, i18n and OpenAPI checks, the vitest suite with coverage and
# its minimums (incl. browser automation, so Chromium is installed), the web UI build and npm audit of the production
# dependencies. Steps run in parallel after "install" and share the workspace.
# Setup and secrets: docs/ci/WOODPECKER.md. This workflow needs no secrets.

variables:
  # node:24-trixie-slim – the same digest as the Dockerfile (Dependabot updates the Dockerfile;
  # keep both in sync, see docs/ci/WOODPECKER.md "Updating pinned images")
  - &node_image node:24-trixie-slim@sha256:43b9ba1142b8dcf33fa8f922ca1be85714adc444e0586c7cf7726daaeabc1bea
  # as in GitHub CI: only images in the documentation are left out – Markdown is checked (Prettier, the configuration
  # tables) and server tests read README.md and files in docs/; .github/** is GitHub's own
  - &code_paths
    exclude: ['docs/**/*.png', 'docs/**/*.svg', '.github/**']
  - &npm_env
    npm_config_fund: 'false'
    npm_config_update_notifier: 'false'

when:
  - event: push
    branch: [main, 'claude/**']
    path: *code_paths
  - event: pull_request
    path: *code_paths
  # tags: release.yaml depends on this workflow; manual: "Run pipeline" in the UI
  - event: [tag, manual]

steps:
  - name: install
    image: *node_image
    environment: *npm_env
    commands:
      - node --version && npm --version
      # as in GitHub CI: no install script runs during the install, then only the reviewed ones (package.json "allowScripts")
      - npm ci --ignore-scripts --no-audit
      - node scripts/install-scripts.mjs --check --run

  - name: typecheck
    image: *node_image
    depends_on: [install]
    commands:
      - npm run typecheck

  - name: lint
    image: *node_image
    depends_on: [install]
    commands:
      - npm run lint # ESLint
      - npm run format:check # Prettier

  - name: validate
    image: *node_image
    depends_on: [install]
    commands:
      - npm run validate # example processes and dashboards

  - name: i18n
    image: *node_image
    depends_on: [install]
    commands:
      - npm run i18n:check
      - npm run i18n:literals # no untranslated texts in the web UI

  - name: openapi
    image: *node_image
    depends_on: [install]
    commands:
      - npm run openapi -- --check # docs/openapi.json is up to date
      - npm run config:docs -- --check # README.md / docs/CONFIGURATION.md variable tables match server/src/config-schema.ts

  - name: test
    image: *node_image
    depends_on: [install]
    environment: *npm_env
    commands:
      # browser automation tests need Chromium and its system libraries (apt, as root);
      # the libraries only exist in this step's container, so install and test in one step
      - npx playwright install --with-deps chromium
      # with coverage and its minimums (server/vitest.config.ts), as the Node 24 tests in GitHub CI
      - npm run test:coverage

  - name: build
    image: *node_image
    depends_on: [install]
    commands:
      - npm run build # web UI → web/dist, server → server/dist
      - node scripts/smoke-server.mjs # the compiled server starts and answers /api/health
      - node scripts/build-exe.mjs --bundle-only # the desktop executable's server bundles as CommonJS

  - name: audit
    image: *node_image
    depends_on: [] # needs only package-lock.json
    environment: *npm_env
    commands:
      - npm audit --omit=dev --audit-level=moderate # production dependencies
