# Browser (UI) tests with Playwright against a demo server (see docs/TESTING.md).
# Separate from ci.yml so both can evolve independently.
name: UI tests

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Install scripts – only the reviewed ones (package.json "allowScripts")
        run: node scripts/install-scripts.mjs --check --run
      - name: Install Chromium for Playwright
        # a hanging install fails here instead of using up the whole job time
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium
      - name: Build web UI
        run: npm run build
      - name: UI tests
        run: npm run test:ui
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/.auth/server.log
          retention-days: 14

  # The same suite with Steward under a path prefix (SM_BASE_PATH=/steward) behind a reverse proxy
  # (scripts/reverse-proxy.mjs), as in docs/INSTALL.md#behind-a-reverse-proxy. Runs in parallel to the
  # job above, so it adds runner minutes but no waiting time.
  playwright-base-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_PATH: /steward
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Install scripts – only the reviewed ones (package.json "allowScripts")
        run: node scripts/install-scripts.mjs --check --run
      - name: Install Chromium for Playwright
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium
      - name: Build web UI
        run: npm run build
      - name: UI tests under /steward behind a reverse proxy
        run: npm run test:ui
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-base-path
          path: |
            playwright-report/
            test-results/
            e2e/.auth/server.log
          retention-days: 14
