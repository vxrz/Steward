# Builds the container image, creates SBOMs with Syft, scans the image with Grype and
# Trivy and – for release tags – publishes it to the GitHub Container Registry, signed
# and attested. Runs weekly as well: new advisories for the base image appear without
# code changes. Details: docs/SECURITY-PIPELINE.md ("Container image").
#
#   pull request, branch push   build + scan linux/amd64 (both variants), nothing is pushed
#   weekly, manual run          build + scan linux/amd64 and linux/arm64, nothing is pushed
#   tag v1.2.3                  build + scan both platforms, then push ghcr.io/<owner>/steward
#                               1.2.3, 1.2, latest (+ the same with "-browser"); pre-releases
#                               (v1.2.3-rc.1) only get their own tag
#   manual run with "push"      as a tag, but only to test-<commit sha>[-browser]
#
# Scan first, push the same bytes: every platform/variant is built once on a native runner
# (job "image") into an OCI archive; Syft, Grype and Trivy scan that archive; only if all of
# them pass, job "publish" combines the archives into a multi-platform index without
# rebuilding (scripts/ci/oci-index.sh) and pushes it with skopeo --preserve-digests, so the
# platform digests in the registry are the scanned ones. Then the index digest is signed
# (cosign, keyless) and gets SLSA build provenance; each platform image gets provenance and
# its CycloneDX SBOM as attestations. Only "publish" can write packages and sign.
name: Container

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '53 5 * * 1' # Mondays 05:53 UTC
  workflow_dispatch:
    inputs:
      push:
        description: 'Also push, sign and attest – only as ghcr.io/<owner>/steward:test-<commit sha>[-browser], never a version or latest'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # true when the images of this run are published (job "publish" runs)
  PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.push) }}

jobs:
  image:
    name: Build, SBOM and scan
    # linux/arm64 on its own (native) runner; pull requests and branch pushes build linux/amd64 only
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))) && '["amd64"]' || '["amd64","arm64"]') }}
        variant: [default, browser] # browser = WITH_BROWSER=1 (Chromium for browser steps)
    permissions:
      contents: read
      actions: read # the SARIF upload reads this workflow run ("Resource not accessible by integration" without it)
      security-events: write # SARIF upload
    env:
      PLATFORM: ${{ matrix.platform }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Names and build information
        id: names
        run: |
          key="$VARIANT-$PLATFORM"
          version="${GITHUB_REF_NAME//\//-}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${version#v}"; fi
          {
            echo "key=$key"
            echo "image=steward:ci-$key"
            echo "browser=$([ "$VARIANT" = browser ] && echo 1 || echo 0)"
            # SARIF categories: the linux/amd64 default image keeps the names it always had
            echo "sarif=$([ "$key" = default-amd64 ] || echo "-$key")"
            echo "version=$version"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # One build, two outputs: the OCI archive that is scanned (and later pushed) and the same
      # image loaded into Docker for the Chromium check
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          push: false
          load: true
          outputs: type=oci,dest=reports/steward-${{ steps.names.outputs.key }}.oci.tar
          tags: ${{ steps.names.outputs.image }}
          provenance: false
          sbom: false
          pull: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.created=${{ steps.names.outputs.date }}
          # build information: shown on the About page and in the system status
          build-args: |
            WITH_BROWSER=${{ steps.names.outputs.browser }}
            SM_BUILD_COMMIT=${{ github.sha }}
            SM_BUILD_DATE=${{ steps.names.outputs.date }}
      # Syft and Trivy scan this unpacked copy of the archive (Trivy reads OCI layouts only as a directory)
      - name: Unpack and check the image (blobs, commit label, digest)
        env:
          KEY: ${{ steps.names.outputs.key }}
        run: |
          mkdir "$RUNNER_TEMP/image"
          tar -xf "reports/steward-$KEY.oci.tar" -C "$RUNNER_TEMP/image"
          scripts/ci/oci-index.sh --revision "$GITHUB_SHA" "$RUNNER_TEMP/oci-check" "reports/steward-$KEY.oci.tar" | tee "$RUNNER_TEMP/digest.txt"
          rm -rf "$RUNNER_TEMP/oci-check"
          echo "Image $KEY: \`$(awk '$1 != "index" { print $2 }' "$RUNNER_TEMP/digest.txt")\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Chromium starts in the image
        if: matrix.variant == 'browser'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
        run: |
          docker run --rm --entrypoint node "$IMAGE" -e "
            const { chromium } = require('playwright');
            chromium.launch({ args: ['--no-sandbox'] }).then(async (b) => { console.log('Chromium', b.version()); await b.close(); });
          "
      - name: Install Syft, Grype and Trivy
        run: scripts/security/install-tools.sh --dir "$RUNNER_TEMP/bin" syft grype trivy && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: SBOM (Syft – CycloneDX and SPDX)
        env:
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          syft scan "oci-dir:$RUNNER_TEMP/image" --source-name steward --source-version "$VERSION" \
            -o cyclonedx-json=reports/sbom.cdx.json -o spdx-json=reports/sbom.spdx.json -o syft-json=reports/sbom.syft.json
      - name: Grype (fails on high/critical with a fix available)
        run: |
          grype "sbom:reports/sbom.syft.json" --only-fixed -o sarif --file reports/grype.sarif || true
          grype "sbom:reports/sbom.syft.json" --only-fixed --fail-on high -o table
      - name: Trivy vulnerability database (with retries)
        if: ${{ !cancelled() }}
        run: scripts/security/trivy-db.sh
      - name: Trivy image (fails on high/critical with a fix available)
        if: ${{ !cancelled() }}
        run: |
          trivy image --skip-db-update --scanners vuln,secret --ignore-unfixed --severity HIGH,CRITICAL --format sarif --output reports/trivy-image.sarif --input "$RUNNER_TEMP/image"
          trivy image --skip-db-update --scanners vuln,secret --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --format table --input "$RUNNER_TEMP/image"
      - name: Upload Grype SARIF
        if: ${{ !cancelled() && hashFiles('reports/grype.sarif') != '' }}
        continue-on-error: true # not available for private repositories without GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: reports/grype.sarif
          category: grype-image${{ steps.names.outputs.sarif }}
      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && hashFiles('reports/trivy-image.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: reports/trivy-image.sarif
          category: trivy-image${{ steps.names.outputs.sarif }}
      - name: Keep SBOMs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-sbom-${{ steps.names.outputs.key }}
          path: |
            reports/sbom.cdx.json
            reports/sbom.spdx.json
          if-no-files-found: ignore
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 30 }}
      - name: Keep scan reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-scan-reports-${{ steps.names.outputs.key }}
          path: |
            reports/*.sarif
            reports/sbom.syft.json
          if-no-files-found: ignore
          retention-days: 30
      # Only when every step above passed (a finding stops the job): the scanned archive for "publish"
      - name: Hand the scanned image to the publish job
        if: ${{ success() && env.PUBLISH == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-oci-${{ steps.names.outputs.key }}
          path: reports/steward-${{ steps.names.outputs.key }}.oci.tar
          if-no-files-found: error
          compression-level: 0 # the layers are compressed already
          retention-days: 1

  # The required status checks name these two jobs (the ruleset predates the matrix): each passes only
  # when every platform and variant of "image" was built and scanned without findings.
  image-checks:
    name: Build, SBOM and scan
    needs: image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every platform and variant built and scanned
        env:
          RESULT: ${{ needs.image.result }}
        run: |
          echo "image jobs: $RESULT"
          test "$RESULT" = success

  browser-variant:
    name: Browser variant builds (WITH_BROWSER=1)
    needs: image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The browser variant built, started Chromium and passed the scans
        env:
          RESULT: ${{ needs.image.result }}
        run: |
          echo "image jobs (including the browser variant): $RESULT"
          test "$RESULT" = success

  publish:
    name: Publish to ghcr.io
    needs: image # every platform and variant built and scanned without findings
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [default, browser]
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing (cosign and the attestations) with this workflow's OIDC identity
      attestations: write # store the provenance and SBOM attestations
    env:
      VARIANT: ${{ matrix.variant }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and tags
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GHCR names are lower case (the repository is vxrz/Steward)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          suffix=""
          if [ "$VARIANT" = browser ]; then suffix=-browser; fi
          if [ "$EVENT" = push ]; then
            # all release tags: "latest" and "1.2" only move forward (a fix for an older line does not take them)
            gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' > "$RUNNER_TEMP/releases.txt"
            tags="$(CI_PIPELINE_EVENT=tag CI_COMMIT_TAG="$GITHUB_REF_NAME" scripts/ci/image-tags.sh --no-major --releases "$RUNNER_TEMP/releases.txt")"
            version="${GITHUB_REF_NAME#v}"
          else
            # manual test run: never a version tag or latest
            tags="test-$GITHUB_SHA"
            version="test-$GITHUB_SHA"
          fi
          printf '%s\n' "$tags" | sed "s/\$/$suffix/" > "$RUNNER_TEMP/tags.txt"
          echo "Tags: $(tr '\n' ' ' < "$RUNNER_TEMP/tags.txt")"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download the scanned images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: container-oci-${{ matrix.variant }}-*
          path: ${{ runner.temp }}/oci
          merge-multiple: true
      - name: Download their SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: container-sbom-${{ matrix.variant }}-*
          path: ${{ runner.temp }}/sbom
      - name: Multi-platform index from the scanned images (no rebuild)
        id: index
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          title=Steward
          if [ "$VARIANT" = browser ]; then title="Steward (with Chromium for browser steps)"; fi
          scripts/ci/oci-index.sh --revision "$GITHUB_SHA" \
            --annotation "org.opencontainers.image.title=$title" \
            --annotation "org.opencontainers.image.description=Repeatable, auditable service procedures for Siemens Insights Hub, Industrial Edge and any REST platform" \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.licenses=Apache-2.0" \
            "$RUNNER_TEMP/layout" "$RUNNER_TEMP/oci/steward-$VARIANT-amd64.oci.tar" "$RUNNER_TEMP/oci/steward-$VARIANT-arm64.oci.tar" \
            | tee "$RUNNER_TEMP/digests.txt"
          grep -q '^linux/amd64 ' "$RUNNER_TEMP/digests.txt"
          grep -q '^linux/arm64' "$RUNNER_TEMP/digests.txt"
          {
            echo "index=$(awk '$1 == "index" { print $2 }' "$RUNNER_TEMP/digests.txt")"
            echo "amd64=$(awk '$1 == "linux/amd64" { print $2 }' "$RUNNER_TEMP/digests.txt")"
            echo "arm64=$(awk '$1 ~ /^linux\/arm64/ { print $2 }' "$RUNNER_TEMP/digests.txt")"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push (digests preserved, checked after the push)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          INDEX: ${{ steps.index.outputs.index }}
        run: |
          while read -r tag; do
            skopeo copy --all --preserve-digests --retry-times 3 "oci:$RUNNER_TEMP/layout:steward" "docker://$IMAGE:$tag"
            pushed="sha256:$(skopeo inspect --raw "docker://$IMAGE:$tag" | sha256sum | cut -d' ' -f1)"
            if [ "$pushed" != "$INDEX" ]; then
              echo "::error::$IMAGE:$tag is $pushed, expected $INDEX"
              exit 1
            fi
            echo "pushed $IMAGE:$tag → $INDEX"
          done < "$RUNNER_TEMP/tags.txt"
      - name: Install cosign
        run: scripts/security/install-tools.sh --dir "$RUNNER_TEMP/bin" cosign && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Keyless: the certificate names this workflow, the ref and the commit (Sigstore, public transparency log)
      - name: Sign the index and every platform image (cosign)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          INDEX: ${{ steps.index.outputs.index }}
        run: cosign sign --yes --recursive "$IMAGE@$INDEX"
      - name: Build provenance (index)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.index.outputs.index }}
          push-to-registry: true
          create-storage-record: false # only available for organization repositories
      - name: Build provenance (linux/amd64)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.index.outputs.amd64 }}
          push-to-registry: true
          create-storage-record: false
      - name: Build provenance (linux/arm64)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.index.outputs.arm64 }}
          push-to-registry: true
          create-storage-record: false
      - name: SBOM attestation (linux/amd64, CycloneDX from Syft)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.index.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/sbom/container-sbom-${{ matrix.variant }}-amd64/sbom.cdx.json
          push-to-registry: true
      - name: SBOM attestation (linux/arm64, CycloneDX from Syft)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.index.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom/container-sbom-${{ matrix.variant }}-arm64/sbom.cdx.json
          push-to-registry: true
      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          INDEX: ${{ steps.index.outputs.index }}
        run: |
          {
            echo "### $IMAGE ($VARIANT)"
            echo
            echo "Index \`$INDEX\`, tags: $(tr '\n' ' ' < "$RUNNER_TEMP/tags.txt")"
            echo
            echo '```'
            cat "$RUNNER_TEMP/digests.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out
        if: always()
        run: |
          docker logout ghcr.io || true
          skopeo logout ghcr.io || true
