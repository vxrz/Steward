name: CI

on:
  # branches are tested through their pull request: a push to a branch would run everything a second time. No tag
  # trigger: release.yml builds tags (and caching npm in a tag-triggered workflow invites cache poisoning, zizmor)
  push:
    branches: [main]
  # no paths filter: the branch rules require checks of this workflow, and a required check that never runs blocks a
  # pull request
  pull_request:

permissions:
  contents: read

# Hardening (see docs/ci/SECURITY-PIPELINE.md): actions pinned to commit SHAs, no persisted git credentials, time limit.
# A new push to a pull request cancels its running checks; every commit on main is tested to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # ESLint, Prettier, the import rules, the translation checks and the generated documents (npm run lint / format:check /
    # check:imports / i18n:check / i18n:literals / config:docs -- --check / openapi -- --check, see CONTRIBUTING.md)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Lint (ESLint)
        run: npm run lint
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: No new import cycles, layer rules kept (npm run check:imports, docs/ARCHITECTURE.md)
        run: npm run check:imports
      - name: Translations in sync (npm run i18n:check, docs/I18N.md)
        run: npm run i18n:check
      - name: No untranslated texts in the web UI (npm run i18n:literals)
        run: npm run i18n:literals
      - name: Environment-variable tables match the configuration schema (npm run config:docs, docs/CONFIGURATION.md)
        run: npm run config:docs -- --check
      - name: OpenAPI document matches the routes (npm run openapi, docs/openapi.json)
        run: npm run openapi -- --check

  build-node24:
    # Typecheck, example validation, the build, the smoke test of the compiled server and the desktop executable's
    # bundle, on Node.js 24 (LTS, the primary version: .nvmrc, Dockerfile, desktop executable) and 26 (Current).
    # Its own job: a build break shows within minutes, not after the tests. One job per version (no matrix), so that
    # each version's gate job below waits for its own build.
    name: build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Install scripts – only the reviewed ones (package.json "allowScripts")
        run: node scripts/install-scripts.mjs --check --run
      - name: Typecheck
        run: npm run typecheck
      - name: Validate example processes and dashboards
        run: npm run validate
      - name: Build web UI and server (web/dist, server/dist)
        run: npm run build
      - name: Smoke test of the compiled server (node server/dist/index.js, health check, PDF worker)
        run: node scripts/smoke-server.mjs
      - name: Bundle the desktop executable's server (CommonJS)
        run: node scripts/build-exe.mjs --bundle-only
      - name: Dependency audit (production dependencies)
        run: node scripts/security/npm-audit.mjs --audit-level=moderate

  build-node26:
    # the same on Node.js 26 (the audit runs once, above)
    name: build (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Install scripts – only the reviewed ones (package.json "allowScripts")
        run: node scripts/install-scripts.mjs --check --run
      - name: Typecheck
        run: npm run typecheck
      - name: Validate example processes and dashboards
        run: npm run validate
      - name: Build web UI and server (web/dist, server/dist)
        run: npm run build
      - name: Smoke test of the compiled server (node server/dist/index.js, health check, PDF worker)
        run: node scripts/smoke-server.mjs
      - name: Bundle the desktop executable's server (CommonJS)
        run: node scripts/build-exe.mjs --bundle-only

  test-node24:
    # The server test suite (incl. browser automation and crash/resume) in shards on their own runners; each shard runs
    # its files in parallel (3 workers, server/vitest.config.ts). Node 24 measures coverage as well (#23): the coverage
    # job merges its shards. A shard takes about 10 minutes, plus up to 15 for the Chromium install on a slow day.
    name: test (Node 24, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Install scripts – only the reviewed ones (package.json "allowScripts")
        run: node scripts/install-scripts.mjs --check --run
      - name: Install Chromium for Playwright
        # the browser only: the runner image has the system libraries (--with-deps spent 10-12 minutes on fonts, see ui-tests.yml)
        # a hanging install fails here instead of using up the whole job time
        timeout-minutes: 15
        run: npx playwright install chromium
      - name: Tests with coverage
        working-directory: server
        # the shard's coverage goes into its blob report; the minimums apply to the merged coverage only
        run: npx vitest run --coverage --coverage.reporter=text-summary --shard="$SHARD" --reporter=default --reporter=blob --outputFile.blob="blob-report/shard-${SHARD%/*}.json"
      - name: Keep the shard's results for the coverage job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-blob-${{ strategy.job-index }}
          path: server/blob-report/
          retention-days: 1
          if-no-files-found: ignore

  test-node26:
    # the same on Node.js 26, without coverage, in 2 shards
    name: test (Node 26, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Install scripts – only the reviewed ones (package.json "allowScripts")
        run: node scripts/install-scripts.mjs --check --run
      - name: Install Chromium for Playwright
        # the browser only: the runner image has the system libraries (--with-deps spent 10-12 minutes on fonts, see ui-tests.yml)
        # a hanging install fails here instead of using up the whole job time
        timeout-minutes: 15
        run: npx playwright install chromium
      - name: Tests
        working-directory: server
        run: npx vitest run --shard="$SHARD"

  coverage:
    # The coverage of the Node 24 shards, merged: summary in the job summary, HTML report as the artifact
    # "server-coverage", and a failure below the minimums in server/vitest.config.ts (docs/TESTING.md#coverage)
    needs: test-node24
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Install scripts – only the reviewed ones (package.json "allowScripts")
        run: node scripts/install-scripts.mjs --check --run
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-blob-*
          path: server/blob-report
          merge-multiple: true
      - name: Merge the shards (test results and coverage, with the minimums)
        working-directory: server
        run: npx vitest --merge-reports=blob-report --coverage
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 14
          if-no-files-found: ignore

  test-postgres-shards:
    # The same test suite on PostgreSQL (every test server gets its own schema), in shards like the tests above
    name: test-postgres (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Install scripts – only the reviewed ones (package.json "allowScripts")
        run: node scripts/install-scripts.mjs --check --run
      - name: Install Chromium for Playwright
        # a hanging install fails here instead of using up the whole job time
        timeout-minutes: 15
        run: npx playwright install chromium
      - name: Tests on PostgreSQL
        run: npm run test:pg -- --shard="$SHARD"

  # Gate jobs: the branch rules of main require the checks "build-test (Node 24)", "build-test (Node 26)" and
  # "test-postgres" (the jobs' names before the build and the tests were split up). Each passes only when every job it
  # needs succeeded – a failed, cancelled or skipped job fails it.
  build-test-node24:
    name: build-test (Node 24)
    needs: [build-node24, test-node24, coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build, tests and coverage succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  build-test-node26:
    name: build-test (Node 26)
    needs: [build-node26, test-node26]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build and tests succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  test-postgres:
    name: test-postgres
    needs: test-postgres-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All PostgreSQL shards succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  test-databases:
    # Database platforms (#203) against real servers: MariaDB 11.4 (LTS) and SQL Server 2022 as service containers
    # (images pinned by digest); PostgreSQL runs in test-postgres. The test creates its own database and accounts.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4.12@sha256:4f1d8d202fcf7bcb3902f63af09f9c1a050c2922a89652f22abaec0d4f015e83
        env:
          MARIADB_ROOT_PASSWORD: steward-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Steward-ci-sa-1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Steward-ci-sa-1 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      SM_TEST_MYSQL_URL: mysql://root:steward-ci-root@127.0.0.1:3306/
      SM_TEST_MSSQL_URL: mssql://sa:Steward-ci-sa-1@127.0.0.1:1433/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Database platforms against MariaDB and SQL Server
        working-directory: server
        run: npx vitest run test/dbms-integration.test.ts
