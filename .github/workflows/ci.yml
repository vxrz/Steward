name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

# Hardening (see docs/ci/SECURITY-PIPELINE.md): actions pinned to commit SHAs, no persisted git credentials, time limit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # ESLint, Prettier, the translation checks and the generated documents (npm run lint / format:check / i18n:check /
    # i18n:literals / config:docs -- --check / openapi -- --check, see CONTRIBUTING.md)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Lint (ESLint)
        run: npm run lint
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Translations in sync (npm run i18n:check, docs/I18N.md)
        run: npm run i18n:check
      - name: No untranslated texts in the web UI (npm run i18n:literals)
        run: npm run i18n:literals
      - name: Environment-variable tables match the configuration schema (npm run config:docs, docs/CONFIGURATION.md)
        run: npm run config:docs -- --check
      - name: OpenAPI document matches the routes (npm run openapi, docs/openapi.json)
        run: npm run openapi -- --check

  build-test:
    # Node.js 24 (LTS) is the primary version (.nvmrc, Dockerfile, desktop executable); 26 (Current) is tested as well
    name: build-test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # the suite takes 40-55 minutes on a hosted runner (0.10.0, with coverage), plus up to 15 for the Chromium install on a slow day: room to finish, a hang still ends
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Install scripts – only the reviewed ones (package.json "allowScripts")
        run: node scripts/install-scripts.mjs --check --run
      - name: Install Chromium for Playwright
        # the browser only: the runner image has the system libraries (--with-deps spent 10-12 minutes on fonts, see ui-tests.yml)
        # a hanging install fails here instead of using up the whole job time
        timeout-minutes: 15
        run: npx playwright install chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Validate example processes and dashboards
        run: npm run validate
      - name: Tests (incl. browser automation and crash/resume)
        if: matrix.node != 24
        run: npm test
      # Node 24 measures coverage as well (#23): reported in the job summary and as an artifact, no minimum yet
      - name: Tests with coverage (incl. browser automation and crash/resume)
        if: matrix.node == 24
        run: npm run test:coverage
      - name: Coverage summary
        if: always() && matrix.node == 24
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage report
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 14
          if-no-files-found: ignore
      - name: Build web UI and server (web/dist, server/dist)
        run: npm run build
      - name: Smoke test of the compiled server (node server/dist/index.js, health check, PDF worker)
        run: node scripts/smoke-server.mjs
      - name: Bundle the desktop executable's server (CommonJS)
        run: node scripts/build-exe.mjs --bundle-only
      - name: Dependency audit (production dependencies)
        if: matrix.node == 24
        run: node scripts/security/npm-audit.mjs --audit-level=moderate

  test-postgres:
    # The same test suite on PostgreSQL (every test server gets its own schema)
    runs-on: ubuntu-latest
    # the suite takes 40-55 minutes on a hosted runner (0.10.0, with coverage), plus up to 15 for the Chromium install on a slow day: room to finish, a hang still ends
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Install scripts – only the reviewed ones (package.json "allowScripts")
        run: node scripts/install-scripts.mjs --check --run
      - name: Install Chromium for Playwright
        # a hanging install fails here instead of using up the whole job time
        timeout-minutes: 15
        run: npx playwright install chromium
      - name: Tests on PostgreSQL
        run: npm run test:pg

  test-databases:
    # Database platforms (#203) against real servers: MariaDB 11.4 (LTS) and SQL Server 2022 as service containers
    # (images pinned by digest); PostgreSQL runs in test-postgres. The test creates its own database and accounts.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4.12@sha256:4f1d8d202fcf7bcb3902f63af09f9c1a050c2922a89652f22abaec0d4f015e83
        env:
          MARIADB_ROOT_PASSWORD: steward-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Steward-ci-sa-1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Steward-ci-sa-1 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      SM_TEST_MYSQL_URL: mysql://root:steward-ci-root@127.0.0.1:3306/
      SM_TEST_MSSQL_URL: mssql://sa:Steward-ci-sa-1@127.0.0.1:1433/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Database platforms against MariaDB and SQL Server
        working-directory: server
        run: npx vitest run test/dbms-integration.test.ts
