name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

# Hardening (see docs/SECURITY-PIPELINE.md): actions pinned to commit SHAs, no persisted git credentials, time limit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # ESLint and Prettier (npm run lint / npm run format:check, see CONTRIBUTING.md)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Lint (ESLint)
        run: npm run lint
      - name: Formatting (Prettier)
        run: npm run format:check

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Install scripts – only the reviewed ones (package.json "allowScripts")
        run: node scripts/install-scripts.mjs --check --run
      - run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Validate example processes and dashboards
        run: npm run validate
      - name: Tests (incl. browser automation and crash/resume)
        run: npm test
      - name: Build web UI
        run: npm run build
      - name: Bundle the desktop executable's server (CommonJS)
        run: node scripts/build-exe.mjs --bundle-only
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=moderate

  test-postgres:
    # The same test suite on PostgreSQL (every test server gets its own schema)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts
      - name: Install scripts – only the reviewed ones (package.json "allowScripts")
        run: node scripts/install-scripts.mjs --check --run
      - run: npx playwright install --with-deps chromium
      - name: Tests on PostgreSQL
        run: npm run test:pg
