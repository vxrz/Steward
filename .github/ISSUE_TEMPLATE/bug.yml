name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems never go into a public issue** – see SECURITY.md.
        Please leave out credentials, personal data and internal host or tenant names (see ISSUES.md).
  - type: input
    id: version
    attributes:
      label: Steward version
      description: _About Steward_ shows it, e.g. 0.2.3
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      multiple: true
      options: [Docker / container image, Desktop executable, Node.js from source, SQLite, PostgreSQL, Behind a path prefix (SM_BASE_PATH)]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      placeholder: What should have happened, and what happened instead
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Screenshots, error codes, System status
      description: Screenshots, the error code from the message, relevant lines from the run protocol or Settings → System status – checked for secrets and personal data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This report contains no credentials, personal data or internal host/tenant names.
          required: true
