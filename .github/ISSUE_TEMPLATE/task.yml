name: Task
description: One piece of planned work, small enough for one session, with acceptance criteria
labels: []
body:
  - type: markdown
    attributes:
      value: A maintainer adds exactly one tier label (`tier:frontier`, `tier:mid` or `tier:bulk`) – see "Task routing" in AGENTS.md.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed, with links to the decision record, roadmap item or issue it comes from.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Observable results as a checklist, including tests and docs.
      value: |
        - [ ] 
        - [ ] Tests cover the change
        - [ ] Docs and the Unreleased section of CHANGELOG.md updated (if users notice the change)
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this task does not do.
  - type: input
    id: depends-on
    attributes:
      label: Depends on
      description: Issues that must be done first, e.g. "#123", or "none".
  - type: dropdown
    id: tier
    attributes:
      label: Suggested tier
      description: The maintainer sets the label; this is a suggestion.
      options:
        - 'tier:bulk – mechanical: tests for existing code, docs, renames, formatting'
        - 'tier:mid – a well-specified feature or fix'
        - 'tier:frontier – design decisions, security-relevant or cross-cutting work'
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This task contains no credentials, personal data or internal host/tenant names.
          required: true
