# Dependabot: weekly update pull requests. Security updates (for known
# vulnerabilities) are opened right away when "Dependabot security updates" is
# enabled in the repository settings. Versions are taken only after a cooldown,
# so a compromised release that is pulled within days does not reach us.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # one PR for all minor and patch updates, majors stay separate (they need a closer look)
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    # the node major version is pinned on purpose (follows .nvmrc / engines)
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build(docker)
