# Steward with PostgreSQL (e.g. on an internal VM):
#
#   echo "STEWARD_DB_PASSWORD=$(openssl rand -hex 24)" > .env
#   docker compose -f docker-compose.postgres.yml up -d      →   http://localhost:4310
#
# The app still needs its data volume: vault file, artifacts, reports and uploaded docs
# live there. Back up both volumes (see docs/INSTALL.md, "Database").
services:
  steward:
    # Signed release image (with Chromium: …:0.1.2-browser). Compose pulls it, and builds it from
    # this checkout only if the registry doesn't have it.
    image: ghcr.io/vxrz/steward:0.1.2
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4310:4310" # remove "127.0.0.1:" to expose on the network (then also set SM_ALLOWED_HOSTS and TLS)
    volumes:
      - steward-data:/data
    # Hardening as in docker-compose.yml: read-only image, no Linux capabilities, no privilege escalation
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    # secrets: [steward_passphrase]
    environment:
      SM_DATABASE_URL: postgres://steward:${STEWARD_DB_PASSWORD:?set STEWARD_DB_PASSWORD in .env}@postgres:5432/steward
      # SM_DATABASE_SCHEMA: steward   # default: public
      SM_ALLOWED_HOSTS: ""
      # Unattended unlock so schedules run after a restart: the passphrase as a Docker secret, not a variable
      # SM_MASTER_PASSPHRASE_FILE: /run/secrets/steward_passphrase
      # SM_TRUST_PROXY: "1"
      # SM_PUBLIC_URL: "https://steward.example.com"
      SM_LOG_LEVEL: info

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: steward
      POSTGRES_USER: steward
      POSTGRES_PASSWORD: ${STEWARD_DB_PASSWORD:?set STEWARD_DB_PASSWORD in .env}
    volumes:
      - steward-pg:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steward -d steward"]
      interval: 5s
      timeout: 5s
      retries: 20
    # no published port: only the app reaches the database

volumes:
  steward-data:
  steward-pg:
# secrets:
#   steward_passphrase:
#     file: ./passphrase.txt
