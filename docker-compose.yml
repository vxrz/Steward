# docker compose up -d   →   http://localhost:4310
# Update: set the new version below, then  docker compose pull && docker compose up -d  (docs/INSTALL.md)
services:
  steward:
    # Signed release image (verify: docs/SECURITY-HARDENING.md#verifying-downloads).
    # With Chromium for browser steps: ghcr.io/vxrz/steward:0.2.1-browser
    image: ghcr.io/vxrz/steward:0.2.1
    # Compose pulls the image above; only if the registry doesn't have it (a version before the first
    # published image, or no access to ghcr.io) does it build it from this checkout instead.
    # To always build locally: "docker compose build --pull && docker compose up -d".
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4310:4310" # remove "127.0.0.1:" to expose on the network (then also set SM_ALLOWED_HOSTS and TLS)
    volumes:
      - sm-data:/data
    # Hardening: read-only image, no Linux capabilities, no privilege escalation
    read_only: true
    tmpfs:
      - /tmp # browser steps (WITH_BROWSER=1) need a writable /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    # Unattended unlock so schedules run after a restart: the passphrase as a Docker secret. Compose mounts the
    # file as it is, so it must belong to the container user (uid 1000) and nobody else may read it:
    #   sudo install -m 400 -o 1000 -g 1000 /dev/null passphrase.txt && sudoedit passphrase.txt
    # With userns-remap or SELinux see docs/INSTALL.md ("The passphrase file in Docker"). Set Steward up in the
    # browser first (with the same passphrase), then turn this on: the file unlocks a vault, it does not create one.
    # secrets: [steward_passphrase]
    environment:
      # Host names users type in the browser (besides localhost)
      SM_ALLOWED_HOSTS: ""
      # SM_MASTER_PASSPHRASE_FILE: /run/secrets/steward_passphrase
      # Behind a reverse proxy (TLS terminated there): its address, and the public https URL (Secure cookie, HSTS)
      # SM_TRUST_PROXY: "172.30.0.1"   # the address the proxy comes from as the container sees it, see docs/INSTALL.md ("Steward in Docker")
      # SM_PUBLIC_URL: "https://steward.example.com"
      # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      # Error reporting to Sentry/GlitchTip/Bugsink (off by default, see docs/ERROR-REPORTING.md)
      # SM_SENTRY_DSN: "https://<key>@glitchtip.example.com/1"
      SM_LOG_LEVEL: info
volumes:
  sm-data:
# secrets:
#   steward_passphrase:
#     file: ./passphrase.txt
