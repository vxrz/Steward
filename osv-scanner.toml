[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2026-12-31
reason = "zod 3.25 (runtime): memory exhaustion while validating very large arrays. Mitigated: every parsed request body is checked before validation (server/src/bodyShape.ts – at most 10,000 items per list, 200,000 values, 100 levels; imports 50,000 / 1,000,000), anonymous bodies at most 64 KB, webhooks at most 512 KB. No 3.x fix; the fix is the zod 4 upgrade (needs .max() on arrays too), issue #63."
